<title>Маг Withrandir 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: 3D-сцена в небе приложения, под ней шапка в реальном размере и пульт. */
:root {
  --sky: #0396ff;
  --sky-hi: #57b9ff;
  --paper: #f3f9ff;
  --ink: #0b3f7a;
  --ink-soft: #5b86b8;
  --card: #ffffff;
  --line: #d6e8fb;
  --font: "Nunito", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--font); font-size: 16px; line-height: 1.45; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 18px; }
h1 { font-weight: 900; font-size: 28px; margin: 0; line-height: 1.1; }
.sub { margin: 4px 0 0; color: var(--ink-soft); font-weight: 600; }
.stage { position: relative; border-radius: 32px; overflow: hidden; aspect-ratio: 11 / 10; max-width: 100%; background: radial-gradient(70% 60% at 50% 42%, var(--sky-hi), var(--sky) 78%); touch-action: none; }
.stage canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
.tag { position: absolute; left: 12px; top: 12px; font-weight: 800; font-size: 13px; color: #fff; background: #ffffff33; padding: 5px 12px; border-radius: 999px; pointer-events: none; }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-weight: 800; padding: 24px; text-align: center; }
.header { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: linear-gradient(180deg, var(--sky), var(--sky-hi)); border-radius: 24px; padding: 14px 18px; color: #fff; font-weight: 900; font-size: 22px; }
.header canvas { width: 56px; height: 53px; flex: none; border-radius: 14px; }
.caption { font-size: 13px; color: var(--ink-soft); margin: 6px 0 0; font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px; }
button.chip { font: 800 15px/1 var(--font); color: var(--ink); background: var(--card); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 16px; padding: 11px 14px; cursor: pointer; }
button.chip:active { transform: translateY(2px); border-bottom-width: 2px; }
button.chip[aria-pressed="true"] { background: var(--sky); border-color: #0277d1; color: #fff; }
button:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
</style>

<div class="wrap">
  <header>
    <h1>Маг Withrandir 3D</h1>
    <p class="sub">Серебристый странник в настоящем 3D: атласная мантия, металл, мягкие тени, светящаяся звезда. Следит за пальцем, на тап прыгает с оборотом.</p>
  </header>

  <div class="stage" id="stage">
    <div class="fallback" id="fallback">Загружаю 3D…</div>
    <div class="tag" id="tag">следит за пальцем</div>
  </div>

  <div>
    <div class="header"><span>Withrandir</span><canvas id="mini" width="168" height="159" aria-hidden="true"></canvas></div>
    <p class="caption">Тот же маг в шапке, в реальном размере 56 × 53 pt.</p>
  </div>

  <div>
    <div class="label">Форма</div>
    <div class="row">
      <button class="chip" data-shade="flat" aria-pressed="true">Грани, как MetaMask</button>
      <button class="chip" data-shade="smooth" aria-pressed="false">Гладкий</button>
    </div>
  </div>
  <div>
    <div class="label">Действия</div>
    <div class="row">
      <button class="chip" id="hop">Тап → party</button>
      <button class="chip" id="drift" aria-pressed="false">Медленный дрейф</button>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = (s) => document.querySelector(s);
const stage = $('#stage');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- Рендер ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = .95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
$('#fallback').remove();

const scene = new THREE.Scene();
// Небо приложения как фон сцены: тот же радиальный градиент, что у шапки.
{
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(256, 215, 10, 256, 256, 330);
  grd.addColorStop(0, '#6cc2ff'); grd.addColorStop(.55, '#2aa3ff'); grd.addColorStop(1, '#0391fb');
  g.fillStyle = grd; g.fillRect(0, 0, 512, 512);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .55;

const camera = new THREE.PerspectiveCamera(28, 1.1, 1, 1000);
camera.position.set(0, 4, 168);
camera.lookAt(0, -1.5, 0);

// ---------- Свет: ключ сверху-слева, холодный контровой сзади, небо сверху ----------
scene.add(new THREE.HemisphereLight(0xe6f4ff, 0x5aa9f0, .35));
const key = new THREE.DirectionalLight(0xfff6ec, 1.7);
key.position.set(-28, 115, 75);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
Object.assign(key.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 10, far: 220 });
key.shadow.radius = 6; key.shadow.bias = -.0004; key.shadow.normalBias = .4;
scene.add(key);
const rim = new THREE.DirectionalLight(0xbfe4ff, 1.8);
rim.position.set(50, 30, -70);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xd9ecff, .5);
fill.position.set(60, -10, 50);
scene.add(fill);

// Земля принимает только тень — синюю, без чёрного.
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ color: 0x0a4f9c, opacity: .28 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -31.4; ground.receiveShadow = true;
scene.add(ground);

// ---------- Материалы ----------
const flatMats = [];
const mat = (o) => { const m = new THREE.MeshPhysicalMaterial({ flatShading: true, ...o }); flatMats.push(m); return m; };
const M = {
  satin:  mat({ color: 0xdfe7f1, roughness: .52, metalness: .08, sheen: .8, sheenRoughness: .45, sheenColor: 0xdff0ff }),
  cloth:  mat({ color: 0xd6e0ec, roughness: .6, metalness: .05, sheen: .7, sheenRoughness: .5, sheenColor: 0xd4ebff }),
  hat:    mat({ color: 0xe3eaf3, roughness: .45, metalness: .1, sheen: .6, sheenColor: 0xe4f2ff }),
  silver: mat({ color: 0xdfe6ef, roughness: .22, metalness: .9 }),
  head:   mat({ color: 0xe9eef5, roughness: .55, metalness: 0 }),
  wood:   mat({ color: 0xeee6d8, roughness: .55, metalness: 0, clearcoat: .4, clearcoatRoughness: .4 }),
  star:   new THREE.MeshPhysicalMaterial({ color: 0xffffff, emissive: 0xcfeaff, emissiveIntensity: 3, roughness: .15, metalness: 0, clearcoat: 1, flatShading: true }),
};

// ---------- Модель по пропорциям знака Wizard.svg (x − 33, Y = 33 − y) ----------
const mage = new THREE.Group();   // целиком: взгляд, прыжок
const body = new THREE.Group();   // дыхание, сжатие
mage.add(body); scene.add(mage);
const add = (geo, m, parent = body) => { const o = new THREE.Mesh(geo, m); o.castShadow = true; o.receiveShadow = true; parent.add(o); return o; };
const lathe = (pts, seg) => new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), seg);

// мантия
const robe = add(lathe([[0, -25.4], [12.8, -25], [15, -21.5], [11.8, -10], [6.8, 2], [3.4, 7], [0, 7.6]], 10), M.satin);
robe.scale.z = .66;
// воротник-пелерина (перевёрнутый треугольник знака)
const collar = add(lathe([[0, -3.4], [6.4, 5], [9.9, 10.6], [0, 11]], 6), M.cloth);
collar.scale.z = .55; collar.position.z = 1.4; collar.rotation.y = Math.PI / 6;
// голова (волосы со спины)
add(new THREE.IcosahedronGeometry(4.9, 1), M.head).position.set(0, 12.8, 0);
// шляпа: поля + колпак, колпак чуть скруглён у кончика
const hat = new THREE.Group(); hat.position.y = 15.9; body.add(hat);
const brim = add(new THREE.CylinderGeometry(8.9, 8.9, 1.3, 12), M.hat, hat); brim.scale.z = .58;
add(lathe([[0, .5], [3.9, .6], [3.2, 3.6], [1.3, 8.4], [.35, 10.4], [0, 10.7]], 8), M.hat, hat);
// рукава: расширяющиеся конусы от плеч в стороны
function sleeve(side) {
  const g = new THREE.Group(); g.position.set(side * 4, 5, 0); body.add(g);
  // профиль рукава вдоль оси: узко у плеча, широкий скруглённый край
  const s = add(lathe([[0, 0], [2.5, 0], [4.6, -6], [7.8, -15], [9.4, -19.6], [9.3, -21], [7.6, -22.1], [0, -22.3]], 9), M.cloth, g);
  s.rotation.z = side * Math.PI / 2; s.scale.z = .36;
  return g;
}
const wingL = sleeve(-1), wingR = sleeve(1);
// брусок слева (из знака)
const bar = add(new THREE.CapsuleGeometry(1.7, 5.6, 3, 8), M.cloth, wingL); bar.position.set(-26.9, -.7, 0); bar.scale.z = .8;
// ноги
for (const x of [-4.1, 4.1]) { const f = add(new THREE.SphereGeometry(2.5, 8, 5, 0, Math.PI * 2, 0, Math.PI / 2), M.satin); f.position.set(x, -31.4, .8); f.scale.set(1, .95, 1.3); }
// посох, кольцо-рука, звезда
const staff = new THREE.Group(); body.add(staff);
add(new THREE.CylinderGeometry(.72, .82, 53.8, 8), M.wood, staff).position.set(31.2, -4.5, 0);
add(new THREE.IcosahedronGeometry(2.6, 1), M.silver, staff).position.set(31.1, 3.5, 0);
add(new THREE.CylinderGeometry(1.3, .8, 1.6, 8), M.silver, staff).position.set(31.2, 22.6, 0);
const starShape = new THREE.Shape();
for (let k = 0; k < 8; k++) {
  const a = Math.PI / 2 - (k * Math.PI) / 4, r = k % 2 ? 1.25 : 4.6;
  const p = [Math.cos(a) * r, Math.sin(a) * r];
  k ? starShape.lineTo(...p) : starShape.moveTo(...p);
}
const starGeo = new THREE.ExtrudeGeometry(starShape, { depth: .6, bevelEnabled: true, bevelThickness: 1.1, bevelSize: .55, bevelSegments: 1 });
starGeo.center();
const star = add(starGeo, M.star, staff); star.position.set(31.2, 28.3, 0); star.castShadow = false;
const starLight = new THREE.PointLight(0xcfeaff, 90, 45, 2);
starLight.position.set(31.2, 28.3, 3); staff.add(starLight);

// ---------- Постобработка: свечение только у звезды (порог выше белой ткани) ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(512, 512), .45, .35, 1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

// ---------- Взгляд за пальцем ----------
const look = { x: 0, y: 0, tx: 0, ty: 0 };
let pointerAt = -1e9, drift = false;
window.addEventListener('pointermove', (e) => {
  const r = stage.getBoundingClientRect();
  look.tx = THREE.MathUtils.clamp(((e.clientX - r.left) / r.width) * 2 - 1, -1.4, 1.4);
  look.ty = THREE.MathUtils.clamp(((e.clientY - r.top) / r.height) * 2 - 1, -1.4, 1.4);
  pointerAt = performance.now();
});

// ---------- Тап: присед → прыжок с оборотом → приземление ----------
const E = { out: (u) => 1 - (1 - u) ** 3, in: (u) => u ** 3, io: (u) => (u < .5 ? 4 * u ** 3 : 1 - (-2 * u + 2) ** 3 / 2) };
const track = (k, t) => {
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (t <= k[i][0]) { const a = k[i - 1], b = k[i]; return a[1] + (b[1] - a[1]) * E[b[2] || 'io']((t - a[0]) / (b[0] - a[0])); }
  return k[k.length - 1][1];
};
const HOP = {
  dur: 1200,
  y:    [[0, 0], [150, 0], [430, 10, 'out'], [530, 10], [740, 0, 'in']],
  sq:   [[0, 0], [150, -.08, 'out'], [310, .05, 'out'], [490, 0], [740, 0], [790, -.07, 'out'], [980, .012, 'out'], [1200, 0]],
  spin: [[0, 0], [170, 0], [740, Math.PI * 2, 'io']],
  arms: [[0, 0], [150, -.08, 'out'], [430, .2, 'out'], [740, -.06, 'in'], [1000, 0]],
  glow: [[0, 0], [430, 1, 'out'], [1200, 0]],
};
let hopT = -1;
const tag = $('#tag');
const hop = () => { hopT = 0; tag.textContent = 'тап → party'; };
renderer.domElement.addEventListener('click', hop);
$('#hop').addEventListener('click', hop);
$('#drift').addEventListener('click', (e) => { drift = !drift; e.currentTarget.setAttribute('aria-pressed', drift); });
document.querySelectorAll('[data-shade]').forEach((b) => b.addEventListener('click', () => {
  const flat = b.dataset.shade === 'flat';
  flatMats.concat(M.star).forEach((m) => { m.flatShading = flat; m.needsUpdate = true; });
  document.querySelectorAll('[data-shade]').forEach((x) => x.setAttribute('aria-pressed', x === b));
}));

// ---------- Кадр ----------
const mini = $('#mini').getContext('2d');
const clock = new THREE.Clock();
let t = 0;
function frame() {
  const dt = Math.min(.05, clock.getDelta()); t += dt;

  const idle = drift || performance.now() - pointerAt > 2500;
  const tx = idle ? Math.sin(t / 3) * .5 : look.tx, ty = idle ? Math.sin(t / 2.2) * .2 - .05 : look.ty;
  const k = 1 - Math.exp(-dt / .14);
  look.x += (tx - look.x) * k; look.y += (ty - look.y) * k;

  let hy = 0, sq = 0, spin = 0, arms = 0, glow = 0;
  if (hopT >= 0) {
    hopT += dt * 1000;
    hy = track(HOP.y, hopT); sq = track(HOP.sq, hopT); spin = reduced ? 0 : track(HOP.spin, hopT);
    arms = track(HOP.arms, hopT); glow = track(HOP.glow, hopT);
    if (hopT >= HOP.dur) { hopT = -1; tag.textContent = 'следит за пальцем'; }
  }
  const br = Math.sin(t * Math.PI * 2 / 3.6);
  mage.rotation.y = look.x * .7 + spin;
  mage.rotation.x = look.y * .22;
  mage.position.y = hy;
  // сжатие от земли: группа тела опирается на ноги
  body.scale.set(1 - sq * .6 - br * .005, 1 + sq + br * .01, 1 - sq * .6 - br * .005);
  body.position.y = -31.4 * (1 - body.scale.y);
  wingL.rotation.z = -(arms + br * .012); wingR.rotation.z = arms + br * .012;
  hat.rotation.z = Math.sin(t * 1.3) * .02 - sq * .3;
  star.rotation.y = t * .7;
  M.star.emissiveIntensity = 3 + Math.sin(t * 2) * .3 + glow * 3;
  starLight.intensity = 50 + glow * 140;
  bloom.strength = .45 + glow * .45;

  composer.render();
  // шапка: центральная часть кадра в размер знака
  const c = renderer.domElement, s = c.height * .9;
  mini.clearRect(0, 0, 168, 159);
  mini.drawImage(c, (c.width - s * 1.057) / 2, c.height * .06, s * 1.057, s, 0, 0, 168, 159);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
