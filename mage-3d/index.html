<title>Маг Withrandir 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: сцена в небе приложения, под ней шапка в реальном размере. Как у MetaMask: низкополигональная модель следит за пальцем. */
:root {
  --sky: #0396ff;
  --sky-hi: #57b9ff;
  --paper: #f3f9ff;
  --ink: #0b3f7a;
  --ink-soft: #5b86b8;
  --card: #ffffff;
  --line: #d6e8fb;
  --font: "Nunito", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--font); font-size: 16px; line-height: 1.45; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 18px; }
h1 { font-weight: 900; font-size: 28px; margin: 0; line-height: 1.1; }
.sub { margin: 4px 0 0; color: var(--ink-soft); font-weight: 600; }
.stage { position: relative; border-radius: 32px; overflow: hidden; background: radial-gradient(70% 60% at 50% 42%, var(--sky-hi), var(--sky) 78%); touch-action: none; }
.stage > svg { display: block; width: 100%; height: auto; cursor: pointer; }
.tag { position: absolute; left: 12px; top: 12px; font-weight: 800; font-size: 13px; color: #fff; background: #ffffff33; padding: 5px 12px; border-radius: 999px; }
.header { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: linear-gradient(180deg, var(--sky), var(--sky-hi)); border-radius: 24px; padding: 14px 18px; color: #fff; font-weight: 900; font-size: 22px; }
.header svg { width: 56px; height: 53px; flex: none; }
.caption { font-size: 13px; color: var(--ink-soft); margin: 6px 0 0; font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
button.chip { font: 800 15px/1 var(--font); color: var(--ink); background: var(--card); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 16px; padding: 11px 14px; cursor: pointer; }
button.chip:active { transform: translateY(2px); border-bottom-width: 2px; }
button.chip[aria-pressed="true"] { background: var(--sky); border-color: #0277d1; color: #fff; }
button:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
#model polygon { stroke-linejoin: round; }
</style>

<div class="wrap">
  <header>
    <h1>Маг Withrandir 3D</h1>
    <p class="sub">Низкополигональный маг по методу логотипа MetaMask: грани с запечённым светом, взгляд за пальцем. Тап — прыжок с оборотом.</p>
  </header>

  <div class="stage" id="stage">
    <svg id="svg" viewBox="-41 -38 82 73" role="img" aria-label="Низкополигональный серебристый маг с посохом и звездой">
      <ellipse id="shadow" cx="0" cy="31.6" rx="16" ry="2.2" fill="#fff" opacity=".3"/>
      <g id="model"></g>
    </svg>
    <div class="tag" id="tag">следит за пальцем</div>
  </div>

  <div>
    <div class="header"><span>Withrandir</span><svg viewBox="-40 -38 80 72" aria-hidden="true"><use href="#model"/></svg></div>
    <p class="caption">Та же модель в шапке, в реальном размере 56 × 53 pt.</p>
  </div>

  <div class="row">
    <button class="chip" id="hop">Тап → party</button>
    <button class="chip" id="drift" aria-pressed="false">Медленный дрейф</button>
  </div>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const NS = 'http://www.w3.org/2000/svg';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Сборка модели: координаты знака Wizard.svg, x − 33, y вверх (Y = 33 − y) ----------
  const V = [];          // вершины [x, y, z]
  const VP = [];         // к какой части относится вершина
  const F = [];          // грани {i:[a,b,c], hi, lo, part}
  const PARTS = [];

  function part(name, hi, lo) { const p = { name, hi, lo, v0: V.length, f0: F.length }; PARTS.push(p); return p; }
  function vtx(p, x, y, z) { V.push([x, y, z]); VP.push(p); return V.length - 1; }
  function tri(p, a, b, c) { F.push({ i: [a, b, c], part: p }); }

  // Тело вращения: профиль [[радиус, Y]], сегменты, центр, сплющивание по глубине.
  function lathe(p, prof, seg, cx, cz, zs = 1, rot = 0) {
    const rings = prof.map(([r, y]) => {
      if (r === 0) return [vtx(p, cx, y, cz)];
      const ring = [];
      for (let s = 0; s < seg; s++) {
        const a = rot + (s / seg) * Math.PI * 2;
        ring.push(vtx(p, cx + Math.cos(a) * r, y, cz + Math.sin(a) * r * zs));
      }
      return ring;
    });
    for (let k = 0; k < rings.length - 1; k++) {
      const A = rings[k], B = rings[k + 1];
      for (let s = 0; s < seg; s++) {
        const s2 = (s + 1) % seg;
        if (A.length === 1) tri(p, A[0], B[s], B[s2]);
        else if (B.length === 1) tri(p, A[s], A[s2], B[0]);
        else { tri(p, A[s], A[s2], B[s2]); tri(p, A[s], B[s2], B[s]); }
      }
    }
  }
  // Лофт вдоль X: сечения-восьмиугольники с фаской — рукава и брусок.
  function loftX(p, rings, cy, cz) {
    const R = rings.map(([x, hh, hd]) => {
      if (hh === 0) return [vtx(p, x, cy, cz)];
      const pts = [[.55, 1], [1, .5], [1, -.5], [.55, -1], [-.55, -1], [-1, -.5], [-1, .5], [-.55, 1]];
      return pts.map(([zz, yy]) => vtx(p, x, cy + yy * hh, cz + zz * hd));
    });
    for (let k = 0; k < R.length - 1; k++) {
      const A = R[k], B = R[k + 1], n = 8;
      for (let s = 0; s < n; s++) {
        const s2 = (s + 1) % n;
        if (A.length === 1) tri(p, A[0], B[s], B[s2]);
        else if (B.length === 1) tri(p, A[s], A[s2], B[0]);
        else { tri(p, A[s], A[s2], B[s2]); tri(p, A[s], B[s2], B[s]); }
      }
    }
  }
  // Икосаэдр — голова и кольцо-рука.
  function ico(p, cx, cy, cz, r, sy = 1) {
    const t = (1 + Math.sqrt(5)) / 2;
    const raw = [[-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0], [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t], [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]];
    const k = r / Math.hypot(1, t);
    const id = raw.map(([x, y, z]) => vtx(p, cx + x * k, cy + y * k * sy, cz + z * k));
    [[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]]
      .forEach(([a, b, c]) => tri(p, id[a], id[b], id[c]));
  }
  // Объёмная четырёхлучевая звезда: лучи и впадины по контуру, центр выпуклый с обеих сторон.
  function star(p, cx, cy, R, r, d) {
    const ring = [];
    for (let k = 0; k < 8; k++) {
      const a = Math.PI / 2 - (k * Math.PI) / 4, rr = k % 2 ? r : R;
      ring.push(vtx(p, cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, 0));
    }
    const f = vtx(p, cx, cy, d), b = vtx(p, cx, cy, -d);
    for (let k = 0; k < 8; k++) { const k2 = (k + 1) % 8; tri(p, ring[k], ring[k2], f); tri(p, ring[k2], ring[k], b); }
    return [cx, cy];
  }

  const silver = ['#ffffff', '#9fb2cc'];
  let P;
  P = part('staff', '#fffdf8', '#c8bfb0'); lathe(P, [[0, 22.6], [.75, 22.2], [.8, -27.2], [0, -27.7]], 6, 31.2, 0, 1, .3);
  P = part('ring', ...silver);             ico(P, 31, 3.5, 0, 2.6);
  P = part('star', '#ffffff', '#c9e6ff');   const starC = star(P, 31.1, 28.1, 5, 1.25, 2.8);
  P = part('wingL', '#f6f8fc', '#a2b4cd'); loftX(P, [[-3.5, 0], [-4, 2.5, 2.1], [-14, 6.2, 2.9], [-24.2, 9.6, 3.2], [-26.4, 8.1, 2.5], [-26.9, 0]], 5, 0);
  P = part('wingR', '#f6f8fc', '#a2b4cd'); loftX(P, [[3.5, 0], [4, 2.5, 2.1], [14, 6.2, 2.9], [24.2, 9.6, 3.2], [26.4, 8.1, 2.5], [26.9, 0]], 5, 0);
  P = part('bar', ...silver);              loftX(P, [[-33.2, 0], [-33, 4.2, 1.4], [-29.4, 4.2, 1.4], [-29.2, 0]], 4.3, 0);
  P = part('robe', '#fbfcff', '#9cafca');  lathe(P, [[0, 7.6], [3.3, 7], [6.6, 2], [11.6, -10], [15, -21], [13.4, -24.9], [0, -25.4]], 8, 0, 0, .62, Math.PI / 8);
  P = part('collar', ...silver);           lathe(P, [[0, 11], [9.8, 10.8], [6.2, 5], [0, -3.2]], 6, 0, 1.2, .5, Math.PI / 6);
  P = part('head', '#ffffff', '#aebfd6');  ico(P, 0, 12.8, 0, 4.9);
  P = part('brim', '#ffffff', '#a7b9d1');  lathe(P, [[0, 16.6], [8.4, 16.6], [8.9, 15.9], [8.4, 15.2], [0, 15.2]], 8, 0, 0, .55, Math.PI / 8);
  P = part('hat', '#ffffff', '#a3b5ce');   lathe(P, [[0, 26.6], [1.1, 24.8], [3.1, 19.6], [3.9, 16.7], [0, 16.7]], 6, 0, 0, .85, Math.PI / 6);
  P = part('footL', ...silver);            lathe(P, [[0, -28.7], [1.8, -29.2], [2.5, -30.5], [0, -31.4]], 6, -4.1, .8, 1.25);
  P = part('footR', ...silver);            lathe(P, [[0, -28.7], [1.8, -29.2], [2.5, -30.5], [0, -31.4]], 6, 4.1, .8, 1.25);
  PARTS.forEach((p, k) => { p.v1 = (PARTS[k + 1] || { v0: V.length }).v0; p.f1 = (PARTS[k + 1] || { f0: F.length }).f0; });

  // ---------- Грани наружу и запечённый свет (как у MetaMask: тон грани не зависит от поворота) ----------
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const norm = (a) => { const l = Math.hypot(...a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t));
  const LIGHT = norm([-.55, .7, .65]);
  const SKY = hex('#cfe4f9');
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

  PARTS.forEach((p) => {
    const c = [0, 0, 0];
    for (let v = p.v0; v < p.v1; v++) { c[0] += V[v][0]; c[1] += V[v][1]; c[2] += V[v][2]; }
    const n = p.v1 - p.v0; c[0] /= n; c[1] /= n; c[2] /= n;
    const hi = hex(p.hi), lo = hex(p.lo);
    for (let f = p.f0; f < p.f1; f++) {
      const face = F[f];
      let [a, b, cc] = face.i.map((i) => V[i]);
      let nn = cross(sub(b, a), sub(cc, a));
      const mid = [(a[0] + b[0] + cc[0]) / 3, (a[1] + b[1] + cc[1]) / 3, (a[2] + b[2] + cc[2]) / 3];
      if (dot(nn, sub(mid, c)) < 0) { face.i = [face.i[0], face.i[2], face.i[1]]; nn = nn.map((x) => -x); }
      nn = norm(nn);
      let tone = .12 + .88 * Math.pow(Math.max(0, dot(nn, LIGHT)), 1.25);
      tone = Math.min(1, Math.max(0, tone + (rnd() - .5) * .14));   // лёгкий разброс граней — «ручная» огранка
      let col = mix(lo, hi, tone);
      if (nn[1] < -.35) col = mix(col, SKY, .35 * -nn[1]);              // отсвет неба снизу
      face.fill = `rgb(${col.join(',')})`;
    }
  });

  // ---------- SVG-полигоны ----------
  const model = $('#model');
  const polys = F.map((f) => {
    const el = document.createElementNS(NS, 'polygon');
    el.setAttribute('fill', f.fill); el.setAttribute('stroke', f.fill); el.setAttribute('stroke-width', '.12');
    model.appendChild(el);
    return el;
  });
  const T = V.map(() => [0, 0, 0]);   // вершины после поворота
  const S = V.map(() => [0, 0]);      // на экране

  // ---------- Взгляд за пальцем (lookRate как у MetaMask, но по времени) ----------
  const stage = $('#stage');
  const look = { x: 0, y: 0, tx: 0, ty: 0 };
  let pointerIn = false, drift = false;
  function aim(e) {
    const r = stage.getBoundingClientRect();
    look.tx = Math.max(-1.4, Math.min(1.4, ((e.clientX - r.left) / r.width) * 2 - 1));
    look.ty = Math.max(-1.4, Math.min(1.4, ((e.clientY - r.top) / r.height) * 2 - 1));
    pointerIn = true;
  }
  window.addEventListener('pointermove', aim);
  document.addEventListener('pointerleave', () => { pointerIn = false; });

  // ---------- Тап: присед → прыжок с полным оборотом → приземление ----------
  const ease = {
    out: (u) => 1 - Math.pow(1 - u, 3), in: (u) => u * u * u,
    io: (u) => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
  };
  const key = (k, t) => {
    if (t <= k[0][0]) return k[0][1];
    for (let i = 1; i < k.length; i++) if (t <= k[i][0]) {
      const a = k[i - 1], b = k[i]; return a[1] + (b[1] - a[1]) * ease[b[2] || 'io']((t - a[0]) / (b[0] - a[0]));
    }
    return k[k.length - 1][1];
  };
  const HOP = {
    dur: 1150,
    y:    [[0, 0], [140, 0], [420, 9, 'out'], [520, 9], [720, 0, 'in']],
    sq:   [[0, 0], [140, -.08, 'out'], [300, .05, 'out'], [480, 0], [720, 0], [770, -.07, 'out'], [950, .012, 'out'], [1150, 0]],
    spin: [[0, 0], [160, 0], [720, Math.PI * 2, 'io']],
  };
  let hopT = -1;
  const tag = $('#tag');
  function hop() { hopT = 0; tag.textContent = 'тап → party'; }

  // ---------- Кадр ----------
  let last = performance.now(), t = 0, order = F.map((_, k) => k);
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;

    let tx = look.tx, ty = look.ty;
    if (!pointerIn || drift) { tx = Math.sin(t / 3) * .45; ty = Math.sin(t / 2.1) * .18 - .05; }
    const k = 1 - Math.exp(-dt / .12);
    look.x += (tx - look.x) * k; look.y += (ty - look.y) * k;

    let hy = 0, sq = 0, spin = 0;
    if (hopT >= 0) {
      hopT += dt * 1000;
      hy = key(HOP.y, hopT); sq = key(HOP.sq, hopT); spin = key(HOP.spin, hopT);
      if (hopT >= HOP.dur) { hopT = -1; tag.textContent = 'следит за пальцем'; }
      if (reduced) spin = 0;
    }
    const breath = Math.sin(t * Math.PI * 2 / 3.6) * .01;
    const syS = 1 + sq + breath, sxS = 1 - sq * .6 - breath * .5;

    const yaw = look.x * .75 + spin, pitch = look.y * .32;
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const starSpin = t * .6, cs = Math.cos(starSpin), ss = Math.sin(starSpin);
    const D = 150;
    for (let i = 0; i < V.length; i++) {
      let [x, y, z] = V[i];
      if (VP[i].name === 'star') { const dx = x - starC[0]; x = starC[0] + dx * cs; z = dx * ss + z * cs; }
      // сжатие-растяжение от земли
      x *= sxS; z *= sxS; y = -31.4 + (y + 31.4) * syS;
      y -= 2;                                       // центр вращения чуть ниже середины
      const x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
      const y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
      T[i][0] = x1; T[i][1] = y2 + 2 + hy; T[i][2] = z2;
      const f = D / (D - z2);
      S[i][0] = x1 * f; S[i][1] = -(y2 + 2 + hy) * f;
    }
    // Отсечение задних граней и сортировка по глубине (алгоритм художника, как у MetaMask)
    const zs = new Float32Array(F.length);
    for (let f = 0; f < F.length; f++) {
      const [a, b, c] = F[f].i;
      const ax = S[a][0], ay = S[a][1];
      const area = (S[b][0] - ax) * (S[c][1] - ay) - (S[c][0] - ax) * (S[b][1] - ay);
      const vis = area < 0;
      zs[f] = vis ? (T[a][2] + T[b][2] + T[c][2]) / 3 : -1e9;
      const el = polys[f];
      if (vis) {
        el.setAttribute('points', `${S[a][0].toFixed(2)},${S[a][1].toFixed(2)} ${S[b][0].toFixed(2)},${S[b][1].toFixed(2)} ${S[c][0].toFixed(2)},${S[c][1].toFixed(2)}`);
        el.style.display = '';
      } else el.style.display = 'none';
    }
    const next = order.slice().sort((p, q) => zs[p] - zs[q]);
    let changed = false;
    for (let n = 0; n < next.length; n++) if (next[n] !== order[n]) { changed = true; break; }
    if (changed) { order = next; for (const f of order) model.appendChild(polys[f]); }

    const air = Math.max(0, hy);
    $('#shadow').setAttribute('rx', (16 * (1 - air * .035)).toFixed(2));
    $('#shadow').setAttribute('opacity', (.3 - air * .015).toFixed(3));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  $('#svg').addEventListener('click', hop);
  $('#hop').addEventListener('click', hop);
  $('#drift').addEventListener('click', (e) => { drift = !drift; e.currentTarget.setAttribute('aria-pressed', drift); });
})();
</script>
