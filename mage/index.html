<title>Маг Withrandir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: сцена в небе приложения, под ней шапка в реальном размере и пульт. Светлый мир без чёрного. */
:root {
  --sky: #0396ff;
  --sky-hi: #57b9ff;
  --paper: #f3f9ff;
  --ink: #0b3f7a;
  --ink-soft: #5b86b8;
  --card: #ffffff;
  --line: #d6e8fb;
  --font: "Nunito", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--font); font-size: 16px; line-height: 1.45; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 18px; }
h1 { font-weight: 900; font-size: 28px; margin: 0; line-height: 1.1; }
.sub { margin: 4px 0 0; color: var(--ink-soft); font-weight: 600; }

.stage { position: relative; border-radius: 32px; overflow: hidden; background: radial-gradient(70% 60% at 50% 42%, var(--sky-hi), var(--sky) 78%); }
.stage > svg { display: block; width: 100%; height: auto; cursor: pointer; touch-action: manipulation; }
.tag { position: absolute; left: 12px; top: 12px; font-weight: 800; font-size: 13px; color: #fff; background: #ffffff33; padding: 5px 12px; border-radius: 999px; }

.header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: linear-gradient(180deg, var(--sky), var(--sky-hi)); border-radius: 24px; padding: 14px 18px;
  color: #fff; font-weight: 900; font-size: 22px;
}
.header svg { width: 56px; height: 53px; flex: none; }
.caption { font-size: 13px; color: var(--ink-soft); margin: 6px 0 0; font-weight: 600; }

.row { display: flex; flex-wrap: wrap; gap: 8px; }
button.chip {
  font: 800 15px/1 var(--font); color: var(--ink); background: var(--card);
  border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 16px; padding: 11px 14px; cursor: pointer;
}
button.chip:active { transform: translateY(2px); border-bottom-width: 2px; }
button.chip[aria-pressed="true"] { background: var(--sky); border-color: #0277d1; color: #fff; }
button:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.swatches { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
.swatch { aspect-ratio: 1; max-width: 100%; border-radius: 50%; padding: 0; cursor: pointer; border: 3px solid var(--card); box-shadow: 0 0 0 2px var(--line); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--sky); }
.label { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px; }

/* Два прочтения одной геометрии: «как в лого» — плоский белый; «объём» — серебро, тени, контур. */
body.flat .p { fill: #fff !important; stroke: #fff !important; }
body.flat .fxonly { display: none; }
body.flat #all, body.flat .ao { filter: none !important; }
</style>

<div class="wrap">
  <header>
    <h1>Маг Withrandir</h1>
    <p class="sub">Серебристый странник на геометрии знака из шапки. Три действия, отточенные по правилам моушен-дизайна.</p>
  </header>

  <div class="stage">
    <svg id="stageSvg" viewBox="-17 -20 103 94" role="img" aria-label="Маг-странник: шляпа, рукава, мантия, посох со звездой">
      <defs>
        <linearGradient id="gSilver" x1=".2" y1="0" x2=".7" y2="1">
          <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#eef2f8"/><stop offset="1" stop-color="#c7d2e2"/>
        </linearGradient>
        <linearGradient id="gRobe" x1=".3" y1="0" x2=".55" y2="1">
          <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#e9eef5"/><stop offset=".86" stop-color="#bfcadb"/><stop offset="1" stop-color="#cfe3f8"/>
        </linearGradient>
        <linearGradient id="gWingL" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f4f7fb"/><stop offset=".6" stop-color="#dbe3ee"/><stop offset="1" stop-color="#bac7d9"/>
        </linearGradient>
        <linearGradient id="gWingR" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e6ecf4"/><stop offset="1" stop-color="#c3cfdf"/>
        </linearGradient>
        <linearGradient id="gStaff" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9c3b8"/>
        </linearGradient>
        <radialGradient id="gGlow"><stop offset="0" id="glowA" stop-color="#bfe6ff" stop-opacity=".95"/><stop offset="1" id="glowB" stop-color="#bfe6ff" stop-opacity="0"/></radialGradient>
        <radialGradient id="gSpec"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <!-- Контур только по силуэту: отделяет белого мага от неба, внутренних обводок нет. -->
        <filter id="fOutline" x="-20%" y="-20%" width="140%" height="140%">
          <feMorphology in="SourceAlpha" operator="dilate" radius=".55" result="d"/>
          <feFlood flood-color="#5f7a9e" flood-opacity=".55"/>
          <feComposite in2="d" operator="in" result="o"/>
          <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <!-- Контактная тень: деталь ложится на то, что под ней. -->
        <filter id="fAO" x="-30%" y="-30%" width="160%" height="170%">
          <feDropShadow dx="0" dy=".7" stdDeviation=".7" flood-color="#6a82a6" flood-opacity=".45"/>
        </filter>
        <clipPath id="clipCrystal"><path d="M64.19 -1.6 L66.45 2.1 L66.45 6.8 L64.19 10.3 L61.93 6.8 L61.93 2.1Z"/></clipPath>
      </defs>

      <ellipse id="shadow" cx="33" cy="65" rx="17" ry="2.2" fill="#fff" opacity=".3"/>
      <g id="all" filter="url(#fOutline)" stroke-linejoin="round">
        <g id="rig">
          <circle class="p" cx="33.0959" cy="20.2587" r="4.81396" fill="url(#gSilver)"/>
          <path class="p" d="M30.6104 49.9002C30.9978 52.8008 35.1936 52.8006 35.5809 49.9002L38.7111 26.4581C38.9118 24.9548 37.7429 23.6188 36.2264 23.6188H29.965C28.4487 23.619 27.2795 24.955 27.4803 26.4581L30.6104 49.9002Z" fill="url(#gSilver)" stroke="url(#gSilver)" stroke-width="5"/>
          <g id="wingL">
            <path class="p" d="M27.1578 26.0748C29.0982 26.9578 29.1211 29.7058 27.1957 30.621L10.8051 38.4092C9.1497 39.1957 7.23772 37.9984 7.22217 36.1658L7.09452 20.8641C7.0794 19.0314 8.97119 17.8024 10.6395 18.5612L27.1578 26.0748Z" fill="url(#gWingL)" stroke="url(#gWingL)" stroke-width="5"/>
            <rect class="p ao" y="24.0698" width="3.81105" height="9.42733" rx="1.9" fill="url(#gSilver)" filter="url(#fAO)"/>
          </g>
          <g id="wingR">
            <path class="p" d="M37.9348 26.0748C35.9944 26.9578 35.9715 29.7058 37.8969 30.621L54.2875 38.4092C55.9429 39.1957 57.8549 37.9984 57.8704 36.1658L57.9981 20.8641C58.0132 19.0314 56.1214 17.8024 54.4531 18.5612L37.9348 26.0748Z" fill="url(#gWingR)" stroke="url(#gWingR)" stroke-width="5"/>
          </g>
          <g id="robe">
            <path class="p ao" d="M28.0822 30.198C30.1289 26.1848 35.8628 26.1847 37.9095 30.198L47.828 49.6451C49.6996 53.3151 47.0339 57.6673 42.9143 57.6675H23.0774C18.9578 57.6673 16.2921 53.3151 18.1637 49.6451L28.0822 30.198Z" fill="url(#gRobe)" stroke="url(#gRobe)" stroke-width="5" filter="url(#fAO)"/>
            <ellipse class="fxonly" cx="27" cy="38" rx="2.2" ry="5" fill="url(#gSpec)" opacity=".7" transform="rotate(24 27 38)"/>
          </g>
          <path class="p ao" d="M32.5894 36.2713C32.7895 36.5487 33.2021 36.5487 33.4023 36.2713L42.7204 23.3608C42.9597 23.0292 42.7227 22.5658 42.3139 22.5655H23.6778C23.269 22.5658 23.032 23.0292 23.2713 23.3608L32.5894 36.2713Z" fill="url(#gSilver)" stroke="url(#gSilver)" stroke-width="5" filter="url(#fAO)"/>
          <g id="hat">
            <path class="p" d="M34.4942 15.0936H31.4972L32.9957 9.57076L34.4942 15.0936Z" fill="url(#gSilver)" stroke="url(#gSilver)" stroke-width="5"/>
            <rect class="p ao" x="25.171" y="16.1448" width="15.6494" height="1.40815" rx="0.7" fill="#fff" stroke="#fff" stroke-width="1.4" filter="url(#fAO)"/>
            <ellipse class="fxonly" cx="31.8" cy="11.2" rx=".8" ry="1.6" fill="url(#gSpec)"/>
          </g>
          <g id="feet">
            <path id="footR" class="p" d="M38.0903 64.487C39.8739 64.487 41.3766 62.8406 40.1154 61.5794C39.3443 60.8083 38.2984 60.375 37.2078 60.375C36.1173 60.375 35.0714 60.8083 34.3003 61.5794C33.0391 62.8406 34.5418 64.487 36.3254 64.487H38.0903Z" fill="url(#gSilver)"/>
            <path id="footL" class="p" d="M29.8665 64.487C31.6501 64.487 33.1527 62.8406 31.8916 61.5794C31.1204 60.8083 30.0746 60.375 28.984 60.375C27.8935 60.375 26.8476 60.8083 26.0764 61.5794C24.8153 62.8406 26.318 64.487 28.1015 64.487H29.8665Z" fill="url(#gSilver)"/>
          </g>
          <g id="staff">
            <rect class="p" x="63.482" y="10.9297" width="1.40815" height="49.7483" rx="0.7" fill="url(#gStaff)" stroke="url(#gStaff)" stroke-width="1.4"/>
            <circle class="p ao" cx="63.9858" cy="29.4856" r="2.5099" fill="url(#gSilver)" stroke="url(#gSilver)" stroke-width="1.8" filter="url(#fAO)"/>
            <path class="p" d="M64.19 11.2 Q62.2 10.4 62.3 7.6 M64.19 11.2 Q66.2 10.4 66.1 7.6" fill="none" stroke="#dfe6ef" stroke-width=".8" stroke-linecap="round"/>
            <g id="crystal">
              <circle id="halo" class="fxonly" cx="64.19" cy="4.4" r="8" fill="url(#gGlow)"/>
              <path class="p" d="M64.19 -1.6 L66.45 2.1 L66.45 6.8 L64.19 10.3 L61.93 6.8 L61.93 2.1Z" fill="#dcecfb" stroke="#dcecfb" stroke-width=".35"/>
              <path class="fxonly" d="M64.19 -1.6 L61.93 2.1 L61.93 6.8 L64.19 10.3 L63.4 4.4Z" fill="#ffffff"/>
              <path class="fxonly" d="M64.19 -1.6 L66.45 2.1 L66.45 6.8 L64.19 10.3 L65 4.4Z" fill="#bcd6ef"/>
              <path id="core" class="fxonly" d="M64.19 1.4 L65.1 3.2 L65.1 5.7 L64.19 7.3 L63.28 5.7 L63.28 3.2Z" fill="#bfe6ff" opacity=".85"/>
              <g clip-path="url(#clipCrystal)" class="fxonly"><rect id="sheen" x="60" y="-3" width="1.1" height="15" fill="#fff" opacity=".85" transform="rotate(22 64.19 4.4)"/></g>
            </g>
          </g>
        </g>
      </g>
      <g id="fx"></g>
    </svg>
    <div class="tag" id="tag">idle</div>
  </div>

  <div>
    <div class="header"><span>Withrandir</span><svg viewBox="-3 -3 75 71" aria-hidden="true"><use href="#all"/></svg></div>
    <p class="caption">Тот же маг в шапке, в реальном размере 56 × 53 pt. Здесь видно, читается ли стиль на маленьком знаке.</p>
  </div>

  <div>
    <div class="label">Стиль</div>
    <div class="row" id="styles">
      <button class="chip" data-style="volume" aria-pressed="true">Серебро и объём</button>
      <button class="chip" data-style="flat" aria-pressed="false">Как в лого</button>
    </div>
  </div>
  <div>
    <div class="label">Действия</div>
    <div class="row">
      <button class="chip" data-act="revive">Тап → party</button>
      <button class="chip" id="walk" aria-pressed="false">Странствует</button>
      <button class="chip" data-act="cast">Колдует</button>
    </div>
  </div>
  <div>
    <div class="label">Свет кристалла · 8 состояний</div>
    <div class="swatches" id="swatches"></div>
  </div>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const svg = $('#stageSvg');
  const NS = 'http://www.w3.org/2000/svg';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const AMP = reduced ? 0.35 : 1;

  // Цвета состояний (ColorState.swift): светится кристалл, сам маг остаётся серебряным.
  const STATES = [
    ['white', '#FFFFFF', '#BFE6FF'], ['pink', '#ED7A92', '#FFA2B6'], ['red', '#D83B5C', '#FF5176'],
    ['orange', '#FF6333', '#FCA286'], ['yellow', '#F3AD2C', '#FFD17C'], ['green', '#6FB52B', '#BDFD7F'],
    ['blue', '#045DC3', '#429AFF'], ['purple', '#553AC1', '#8B6EFF'],
  ];
  let light = '#BFE6FF';
  function tint(c) {
    light = c;
    $('#glowA').setAttribute('stop-color', c); $('#glowB').setAttribute('stop-color', c);
    $('#core').setAttribute('fill', c);
  }

  // ---------- Кривые: у каждого сегмента своя, линейных перемещений нет ----------
  const E = {
    lin: (u) => u,
    io: (u) => (1 - Math.cos(Math.PI * u)) / 2,                       // sine in-out
    out: (u) => 1 - Math.pow(1 - u, 3),                                 // ease-out cubic
    in: (u) => u * u * u,                                               // ease-in cubic
    ioc: (u) => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
    back: (u) => { const c = 1.35, d = c + 1; return 1 + d * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
    expo: (u) => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u)),
  };
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

  // Трек = ключи [мс, значение, кривая сегмента]. Значения — смещения от позы покоя.
  function sample(keys, t) {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      const b = keys[i];
      if (t <= b[0]) {
        const a = keys[i - 1], u = (t - a[0]) / (b[0] - a[0]);
        return a[1] + (b[1] - a[1]) * E[b[2] || 'io'](u);
      }
    }
    return keys[keys.length - 1][1];
  }
  const PROPS = ['y', 'sx', 'sy', 'wing', 'hat', 'staffY', 'staffR', 'glow', 'core'];

  // ---------- Три действия ----------
  const ACTIONS = {
    // Тап → party. Присед → толчок → зависание → падение → удар → отдача. Характер: лёгкий, сдержанный.
    party: {
      label: 'тап → party', dur: 1250,
      tracks: {
        sy:   [[0, 0], [150, -.075, 'out'], [260, .055, 'out'], [400, 0, 'io'], [560, 0], [610, -.06, 'out'], [780, .012, 'out'], [980, 0, 'io']],
        sx:   [[0, 0], [150, .05, 'out'],   [260, -.035, 'out'], [400, 0, 'io'], [560, 0], [610, .045, 'out'], [780, -.008, 'out'], [980, 0, 'io']],
        y:    [[0, 0], [150, 0], [380, -8.5, 'out'], [450, -8.5, 'io'], [590, 0, 'in']],
        wing: [[0, 0], [150, -4, 'out'], [410, 9, 'back'], [590, -2.5, 'in'], [820, 1, 'out'], [1080, 0, 'io']],
        staffY: [[0, 0], [150, .8, 'out'], [400, -1.2, 'out'], [600, .4, 'in'], [900, 0, 'io']],
        glow: [[0, 0], [150, -.15, 'out'], [420, 1.1, 'expo'], [1250, 0, 'io']],
        core: [[0, 0], [420, 1, 'expo'], [1250, 0, 'io']],
      },
      events: [[430, () => { ring(9, 650, .7); sparkles(4, 1.0, 60); }], [600, () => dust()], [980, () => (tag.textContent = 'открывается party mode')]],
    },
    // Колдует. Собирает свет → поднимает посох → вспышка → держит → опускает. Характер: торжественно, без суеты.
    cast: {
      label: 'колдует', dur: 2000,
      tracks: {
        y:      [[0, 0], [380, .5, 'out'], [720, -1.3, 'back'], [1300, -1.3], [1750, 0, 'io']],
        sy:     [[0, 0], [380, -.04, 'out'], [720, .035, 'back'], [950, 0, 'io']],
        sx:     [[0, 0], [380, .025, 'out'], [720, -.02, 'back'], [950, 0, 'io']],
        wing:   [[0, 0], [380, -4, 'out'], [740, 13, 'back'], [1300, 11], [1800, 0, 'io']],
        staffY: [[0, 0], [380, 1.1, 'out'], [740, -5.5, 'back'], [1300, -5.5], [1800, 0, 'ioc']],
        staffR: [[0, 0], [380, 1.5, 'out'], [740, -4, 'out'], [1300, -4], [1800, 0, 'ioc']],
        hat:    [[0, 0], [740, -2.5, 'back'], [1300, -2], [1800, 0, 'io']],
        glow:   [[0, 0], [380, -.3, 'out'], [760, 1.7, 'expo'], [1350, .75, 'io'], [2000, 0, 'io']],
        core:   [[0, 0], [300, .5, 'in'], [760, 1.4, 'expo'], [2000, 0, 'io']],
      },
      events: [[0, () => motes(6)], [760, () => { ring(15, 800, .9); sparkles(7, 1.35, 45); }], [900, () => ring(9, 650, .55)]],
    },
  };

  // ---------- Состояние ----------
  const tag = $('#tag');
  let act = null, actT = 0, fired = 0;
  let prev = null, prevT = 0;           // снимок прерванного действия: гаснет за 160 мс, без рывка
  let walkOn = false, walkAmp = 0, walkPh = 0;
  const off = {};

  function start(name) {
    if (act) { prev = { ...off }; prevT = 0; }
    act = ACTIONS[name]; actT = 0; fired = 0;
    tag.textContent = act.label;
  }

  // ---------- Частицы: мало, медленно, по дугам ----------
  const fx = $('#fx');
  const live = [];
  function crystalPoint() {
    const p = new DOMPoint(64.19, 4.4).matrixTransform($('#crystal').getScreenCTM());
    return p.matrixTransform(svg.getScreenCTM().inverse());
  }
  const sparkPath = (r) => `M0,${-r} Q${r * .16},${-r * .16} ${r},0 Q${r * .16},${r * .16} 0,${r} Q${-r * .16},${r * .16} ${-r},0 Q${-r * .16},${-r * .16} 0,${-r}Z`;
  function add(el, o) { fx.appendChild(el); live.push({ el, t: -(o.delay || 0), ...o }); }

  // Искры той самой формы: вырастают, плывут вверх по дуге, поворачиваются на 45°, тают.
  function sparkles(n, scale = 1, stagger = 50) {
    if (reduced) n = Math.min(n, 2);
    const o = crystalPoint();
    for (let i = 0; i < n; i++) {
      const side = i % 2 ? 1 : -1;
      const a = -Math.PI / 2 + side * (.35 + Math.random() * .9);
      const sp = (9 + Math.random() * 7) * scale;
      const el = document.createElementNS(NS, 'path');
      el.setAttribute('d', sparkPath(1.4 + Math.random() * 1.0));
      el.setAttribute('fill', i % 3 === 1 ? light : '#fff');
      add(el, { kind: 'spark', x: o.x, y: o.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, dur: 1100 + Math.random() * 500, delay: i * stagger, spin: side * (30 + Math.random() * 25) });
    }
  }
  // Тонкое кольцо света: быстро расходится, медленно гаснет (ease-out expo).
  function ring(r1, dur, op) {
    const o = crystalPoint();
    const el = document.createElementNS(NS, 'circle');
    el.setAttribute('cx', o.x); el.setAttribute('cy', o.y); el.setAttribute('fill', 'none'); el.setAttribute('stroke', '#fff');
    add(el, { kind: 'ring', r1, dur, op });
  }
  // Сбор света: точки со всех сторон втягиваются в кристалл.
  function motes(n) {
    if (reduced) n = 2;
    for (let i = 0; i < n; i++) {
      const el = document.createElementNS(NS, 'circle');
      el.setAttribute('fill', i % 2 ? light : '#fff');
      const a = (i / n) * Math.PI * 2 + Math.random() * .5, R = 9 + Math.random() * 3;
      add(el, { kind: 'mote', a, R, dur: 420, delay: i * 40 });
    }
  }
  // Пыль при приземлении: два облачка расходятся от ног.
  function dust() {
    [-1, 1].forEach((d) => {
      const el = document.createElementNS(NS, 'ellipse');
      el.setAttribute('fill', '#fff');
      add(el, { kind: 'dust', d, dur: 520 });
    });
  }
  function stepFx(dt) {
    const cp = live.some((p) => p.kind === 'mote') ? crystalPoint() : null;
    for (let i = live.length - 1; i >= 0; i--) {
      const p = live[i]; p.t += dt * 1000;
      if (p.t < 0) { p.el.setAttribute('opacity', 0); continue; }
      const u = p.t / p.dur;
      if (u >= 1) { p.el.remove(); live.splice(i, 1); continue; }
      if (p.kind === 'spark') {
        const k = Math.exp(-2.2 * dt);
        p.vx *= k; p.vy = p.vy * k - 4 * dt;                 // сопротивление воздуха и лёгкая подъёмная сила
        p.x += p.vx * dt; p.y += p.vy * dt;
        const s = u < .22 ? E.back(u / .22) : 1 - E.in((u - .22) / .78);
        p.el.setAttribute('transform', `translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) rotate(${(p.spin * E.out(u)).toFixed(1)}) scale(${Math.max(0, s).toFixed(3)})`);
        p.el.setAttribute('opacity', 1);
      } else if (p.kind === 'ring') {
        const e = E.expo(u);
        p.el.setAttribute('r', (1.5 + (p.r1 - 1.5) * e).toFixed(2));
        p.el.setAttribute('stroke-width', (.7 * (1 - u)).toFixed(3));
        p.el.setAttribute('opacity', (p.op * (1 - E.out(u))).toFixed(3));
      } else if (p.kind === 'mote' && cp) {
        const e = E.in(u), R = p.R * (1 - e);
        p.el.setAttribute('cx', (cp.x + Math.cos(p.a + e * 1.2) * R).toFixed(2));
        p.el.setAttribute('cy', (cp.y + Math.sin(p.a + e * 1.2) * R).toFixed(2));
        p.el.setAttribute('r', (.55 * Math.sin(Math.PI * Math.min(1, u * 1.1))).toFixed(3));
        p.el.setAttribute('opacity', .95);
      } else if (p.kind === 'dust') {
        const e = E.out(u);
        p.el.setAttribute('cx', (33 + p.d * (4 + 6 * e)).toFixed(2));
        p.el.setAttribute('cy', (64.3 - 1.2 * e).toFixed(2));
        p.el.setAttribute('rx', (1.2 + 2.2 * e).toFixed(2));
        p.el.setAttribute('ry', (.6 + .8 * e).toFixed(2));
        p.el.setAttribute('opacity', (.55 * (1 - E.in(u))).toFixed(3));
      }
    }
  }

  // ---------- Вторичное движение: шляпа и рукава догоняют тело по инерции ----------
  const lag = { hat: { x: 0, v: 0 }, wing: { x: 0, v: 0 } };
  let lastY = 0, lastVY = 0;

  // ---------- Фон: дыхание, блик на кристалле, редкая одинокая искра ----------
  let sheenT = -1, nextSheen = 2200, nextSpark = 3200;

  let last = performance.now(), t = 0;
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;

    // основной слой: действие
    for (const k of PROPS) off[k] = 0;
    if (act) {
      actT += dt * 1000;
      for (const k in act.tracks) off[k] = sample(act.tracks[k], actT);
      while (fired < act.events.length && act.events[fired][0] <= actT) act.events[fired++][1]();
      if (actT >= act.dur) { act = null; tag.textContent = walkOn ? 'странствует' : 'idle'; }
    }
    if (prev) {
      prevT += dt * 1000;
      const w = 1 - E.out(Math.min(1, prevT / 160));
      for (const k of PROPS) off[k] += (prev[k] || 0) * w;
      if (w <= 0) prev = null;
    }

    // странствие: амплитуда плавно входит и выходит, шаг не обрывается
    walkAmp += ((walkOn ? 1 : 0) - walkAmp) * (1 - Math.exp(-dt / .22));
    if (walkAmp > .002) walkPh += dt * Math.PI * 2 / 1.05;
    const wa = walkAmp * AMP, s1 = Math.sin(walkPh);
    const liftL = Math.pow(Math.max(0, s1), 1.6) * 1.9 * wa;
    const liftR = Math.pow(Math.max(0, -s1), 1.6) * 1.9 * wa;
    const bob = -.9 * s1 * s1 * wa;                           // выше всего — в момент переноса ноги
    const shift = .55 * Math.sin(walkPh - .25) * wa;          // вес на опорную ногу
    const lean = 1.3 * Math.sin(walkPh - .35) * wa;
    const wingSwing = 2.4 * Math.sin(walkPh - .6) * wa;       // рукава запаздывают за телом
    const staffLift = -1.3 * Math.pow(Math.max(0, -Math.sin(walkPh - .2)), 1.4) * wa;

    // дыхание 3.6 с, амплитуда ~1.2 %
    const br = Math.sin(t * Math.PI * 2 / 3.6) * AMP;
    const y = off.y * AMP + bob;
    const sx = 1 + off.sx * AMP - br * .007;
    const sy = 1 + off.sy * AMP + br * .012;

    // инерция: ускорение тела раскачивает шляпу и рукава
    const vy = (y - lastY) / Math.max(dt, 1e-3); const ay = (vy - lastVY) / Math.max(dt, 1e-3);
    lastY = y; lastVY = vy;
    for (const [key, k, d, gain, lim] of [['hat', 260, 15, -.0045, 1.2], ['wing', 170, 11, .045, 6]]) {
      const L = lag[key];
      L.v += (-k * L.x - d * L.v + clamp(ay, -900, 900) * gain) * dt;
      L.x = clamp(L.x + L.v * dt, -lim, lim);
    }

    $('#rig').setAttribute('transform',
      `translate(${shift.toFixed(3)} ${y.toFixed(3)}) rotate(${lean.toFixed(3)} 33 64.5) translate(33 64.5) scale(${sx.toFixed(4)} ${sy.toFixed(4)}) translate(-33 -64.5)`);
    const air = Math.max(0, -y);
    $('#shadow').setAttribute('rx', (17 * (1 - air * .035)).toFixed(2));
    $('#shadow').setAttribute('opacity', (.3 - air * .016).toFixed(3));

    const wUp = (off.wing * AMP) + lag.wing.x + Math.sin(t * Math.PI * 2 / 3.6 - .8) * .6 * AMP;
    $('#wingL').setAttribute('transform', `rotate(${(wUp + wingSwing).toFixed(3)} 27 28)`);
    $('#wingR').setAttribute('transform', `rotate(${(-wUp + wingSwing).toFixed(3)} 39 28)`);
    $('#hat').setAttribute('transform', `translate(0 ${lag.hat.x.toFixed(3)}) rotate(${(off.hat * AMP - lean * .35).toFixed(3)} 33 17)`);
    $('#footL').setAttribute('transform', `translate(0 ${(-liftL).toFixed(3)})`);
    $('#footR').setAttribute('transform', `translate(0 ${(-liftR).toFixed(3)})`);
    $('#staff').setAttribute('transform', `translate(0 ${(off.staffY * AMP + staffLift).toFixed(3)}) rotate(${(off.staffR * AMP).toFixed(3)} 64 29.5)`);

    // кристалл: спокойное свечение + вспышки действий
    const g = .5 + .07 * Math.sin(t * 1.7) + off.glow;
    $('#halo').setAttribute('transform', `translate(64.19 4.4) scale(${clamp(.6 + g * .45, .35, 1.6).toFixed(3)}) translate(-64.19 -4.4)`);
    $('#halo').setAttribute('opacity', clamp(.35 + g * .38, 0, 1).toFixed(3));
    $('#core').setAttribute('opacity', clamp(.55 + off.core * .45 + .1 * Math.sin(t * 1.7), 0, 1).toFixed(3));

    // блик пробегает по граням раз в несколько секунд
    nextSheen -= dt * 1000;
    if (nextSheen <= 0 && sheenT < 0) { sheenT = 0; nextSheen = 3800 + Math.random() * 2400; }
    if (sheenT >= 0) {
      sheenT += dt * 1000;
      const u = Math.min(1, sheenT / 750);
      $('#sheen').setAttribute('x', (60 + 8 * E.ioc(u)).toFixed(3));
      if (u >= 1) sheenT = -1;
    }
    // в покое изредка поднимается одна искра — фоновая жизнь, не больше
    nextSpark -= dt * 1000;
    if (nextSpark <= 0) { nextSpark = 3000 + Math.random() * 2500; if (!act && !document.body.classList.contains('flat')) sparkles(1, .55, 0); }

    stepFx(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- Входы ----------
  document.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => start(b.dataset.act === 'revive' ? 'party' : 'cast')));
  svg.addEventListener('click', () => start('party'));
  $('#walk').addEventListener('click', (e) => {
    walkOn = !walkOn; e.currentTarget.setAttribute('aria-pressed', walkOn);
    if (!act) tag.textContent = walkOn ? 'странствует' : 'idle';
  });
  document.querySelectorAll('[data-style]').forEach((b) => b.addEventListener('click', () => {
    document.body.classList.toggle('flat', b.dataset.style === 'flat');
    document.querySelectorAll('[data-style]').forEach((x) => x.setAttribute('aria-pressed', x === b));
  }));
  const swEl = $('#swatches');
  STATES.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'swatch'; b.style.background = s[1];
    b.setAttribute('aria-label', s[0]); b.setAttribute('aria-pressed', i === 0);
    b.addEventListener('click', () => {
      tint(s[2]); ring(8, 600, .6);
      swEl.querySelectorAll('.swatch').forEach((x) => x.setAttribute('aria-pressed', x === b));
    });
    swEl.appendChild(b);
  });
})();
</script>
