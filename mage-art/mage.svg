<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -14 105 94" role="img" aria-labelledby="t">
  <title id="t">Маг Withrandir</title>
  <defs>
    <!-- небо -->
    <radialGradient id="sky" cx=".45" cy=".35" r=".85" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#8fd3ff"/><stop offset=".35" stop-color="#4fb4ff"/><stop offset=".7" stop-color="#1a9dff"/><stop offset="1" stop-color="#0388f0"/>
    </radialGradient>
    <radialGradient id="floor" color-interpolation="linearRGB"><stop offset="0" stop-color="#e6f5ff" stop-opacity=".55"/><stop offset=".6" stop-color="#b8e2ff" stop-opacity=".18"/><stop offset="1" stop-color="#b8e2ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="contact" color-interpolation="linearRGB"><stop offset="0" stop-color="#0a4f9c" stop-opacity=".55"/><stop offset="1" stop-color="#0a4f9c" stop-opacity="0"/></radialGradient>

    <!-- материалы: свет сверху слева, тень холодная, отсвет неба снизу -->
    <linearGradient id="wingL" x1="0" y1="0" x2=".55" y2="1" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#f1f5fa"/><stop offset=".62" stop-color="#d3deeb"/><stop offset=".86" stop-color="#b3c4dc"/><stop offset="1" stop-color="#a6badb"/>
    </linearGradient>
    <linearGradient id="wingR" x1=".1" y1="0" x2=".7" y2="1" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#f7fafd"/><stop offset=".3" stop-color="#e6edf5"/><stop offset=".62" stop-color="#c6d3e5"/><stop offset=".86" stop-color="#a9bcd8"/><stop offset="1" stop-color="#9db3d6"/>
    </linearGradient>
    <linearGradient id="robe" x1=".15" y1="0" x2=".85" y2="1" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".25" stop-color="#f3f7fb"/><stop offset=".55" stop-color="#dbe4ef"/><stop offset=".8" stop-color="#bccbdf"/><stop offset="1" stop-color="#a8bcd8"/>
    </linearGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="1" y2="1" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#eef3f9"/><stop offset="1" stop-color="#c3d1e4"/>
    </linearGradient>
    <radialGradient id="hair" cx=".38" cy=".32" r=".75" fx=".3" fy=".25" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#eef3f9"/><stop offset=".85" stop-color="#cdd8e8"/><stop offset="1" stop-color="#b6c6dd"/>
    </radialGradient>
    <linearGradient id="hat" x1=".1" y1="0" x2=".9" y2=".9" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#e9eff6"/><stop offset="1" stop-color="#a9bcd7"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#dfe7f1"/><stop offset="1" stop-color="#9fb3d2"/>
    </linearGradient>
    <radialGradient id="boot" cx=".4" cy=".3" r=".8" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#e3ecf6"/><stop offset=".5" stop-color="#b8cae1"/><stop offset="1" stop-color="#8ea6c8"/>
    </radialGradient>
    <radialGradient id="glove" cx=".35" cy=".3" r=".8" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#d9e3ef"/><stop offset="1" stop-color="#9fb4d3"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#f4e2c6"/><stop offset=".35" stop-color="#dcbb92"/><stop offset=".75" stop-color="#b48a60"/><stop offset="1" stop-color="#936e4b"/>
    </linearGradient>
    <radialGradient id="starCore" cx=".5" cy=".5" r=".5" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#f4fbff"/><stop offset="1" stop-color="#bfe6ff"/>
    </radialGradient>
    <radialGradient id="bloom" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".25" stop-color="#d6f0ff" stop-opacity=".6"/><stop offset="1" stop-color="#bfe6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gem" cx=".35" cy=".3" r=".8" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#cfeeff"/><stop offset="1" stop-color="#5fb8ff"/>
    </radialGradient>

    <!-- орнамент: треугольники на ленте -->
    <pattern id="trim" x="0" y="54.3" width="3" height="10" patternUnits="userSpaceOnUse">
      <rect width="3" height="10" fill="#8fb6e4"/><rect y=".5" width="3" height=".35" fill="#ffffff" opacity=".85"/><path d="M.45,3.2 L1.5,1.3 L2.55,3.2Z" fill="#ffffff"/>
    </pattern>
    <pattern id="trimV" x="3" y="0" width="10" height="3" patternUnits="userSpaceOnUse">
      <rect width="10" height="3" fill="#8fb6e4"/><rect x="5.9" width=".35" height="3" fill="#ffffff" opacity=".85"/><path d="M3.1,.45 L5,1.5 L3.1,2.55Z" fill="#ffffff"/>
    </pattern>
    <pattern id="trimVR" x="52" y="0" width="10" height="3" patternUnits="userSpaceOnUse">
      <rect width="10" height="3" fill="#8fb6e4"/><rect x="3.75" width=".35" height="3" fill="#ffffff" opacity=".85"/><path d="M6.9,.45 L5,1.5 L6.9,2.55Z" fill="#ffffff"/>
    </pattern>

    <!-- формы силуэта (обводка 5 из знака = скругление) -->
    <path id="pWingL" d="M27.1578 26.0748C29.0982 26.9578 29.1211 29.7058 27.1957 30.621L10.8051 38.4092C9.1497 39.1957 7.23772 37.9984 7.22217 36.1658L7.09452 20.8641C7.0794 19.0314 8.97119 17.8024 10.6395 18.5612L27.1578 26.0748Z"/>
    <path id="pWingR" d="M37.9348 26.0748C35.9944 26.9578 35.9715 29.7058 37.8969 30.621L54.2875 38.4092C55.9429 39.1957 57.8549 37.9984 57.8704 36.1658L57.9981 20.8641C58.0132 19.0314 56.1214 17.8024 54.4531 18.5612L37.9348 26.0748Z"/>
    <path id="pRobe" d="M28.0822 30.198C30.1289 26.1848 35.8628 26.1847 37.9095 30.198L47.828 49.6451C49.6996 53.3151 47.0339 57.6673 42.9143 57.6675H23.0774C18.9578 57.6673 16.2921 53.3151 18.1637 49.6451L28.0822 30.198Z"/>
    <path id="pCollar" d="M32.5894 36.2713C32.7895 36.5487 33.2021 36.5487 33.4023 36.2713L42.7204 23.3608C42.9597 23.0292 42.7227 22.5658 42.3139 22.5655H23.6778C23.269 22.5658 23.032 23.0292 23.2713 23.3608L32.5894 36.2713Z"/>
    <path id="pHat" d="M34.4942 15.0936H31.4972L32.9957 9.57076L34.4942 15.0936Z"/>
    <path id="pStar" d="M64.0938 9.82849C64.0474 5.6907 63.3179 4.93077 59.1715 4.93077C63.3179 4.93077 64.0938 4.21112 64.0938 0C64.0938 4.21112 64.8536 4.93077 69 4.93077C64.8536 4.93077 64.0474 5.6907 64.0938 9.82849Z"/>
    <path id="pFootR" d="M38.0903 64.487C39.8739 64.487 41.3766 62.8406 40.1154 61.5794C39.3443 60.8083 38.2984 60.375 37.2078 60.375C36.1173 60.375 35.0714 60.8083 34.3003 61.5794C33.0391 62.8406 34.5418 64.487 36.3254 64.487H38.0903Z"/>
    <path id="pFootL" d="M29.8665 64.487C31.6501 64.487 33.1527 62.8406 31.8916 61.5794C31.1204 60.8083 30.0746 60.375 28.984 60.375C27.8935 60.375 26.8476 60.8083 26.0764 61.5794C24.8153 62.8406 26.318 64.487 28.1015 64.487H29.8665Z"/>

    <clipPath id="cWingL"><use href="#pWingL" stroke="#000" stroke-width="5" stroke-linejoin="round"/></clipPath>
    <clipPath id="cWingR"><use href="#pWingR"/></clipPath>
    <clipPath id="cRobe"><use href="#pRobe"/></clipPath>
    <clipPath id="cHem"><rect x="10" y="54.3" width="46" height="10"/></clipPath>
    <clipPath id="cCuffL"><rect x="0" y="10" width="9.4" height="34"/></clipPath>
    <clipPath id="cCuffR"><rect x="55.6" y="10" width="10" height="34"/></clipPath>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="linearRGB"><feGaussianBlur stdDeviation=".7"/></filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="linearRGB"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="linearRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation=".7" result="b"/><feOffset in="b" dy=".6" result="o"/>
      <feFlood flood-color="#3d5f93" flood-opacity=".42"/><feComposite in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- контур по силуэту: отделяет белого мага от неба, без чёрного -->
    <filter id="contour" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="linearRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius=".45" result="d"/>
      <feFlood flood-color="#1c62b3" flood-opacity=".42"/><feComposite in2="d" operator="in" result="o"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="gb"/><feOffset in="gb" dx=".6" dy="1.2" result="go"/>
      <feFlood flood-color="#0b4d99" flood-opacity=".28"/><feComposite in2="go" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- ФОН -->
  <g id="background">
    <rect x="-18" y="-14" width="105" height="94" fill="url(#sky)"/>
    <g fill="#ffffff" filter="url(#softer)">
      <circle cx="-4" cy="6" r="5" opacity=".08"/><circle cx="80" cy="44" r="7" opacity=".07"/>
      <circle cx="12" cy="-6" r="2.4" opacity=".12"/><circle cx="76" cy="-4" r="3" opacity=".1"/>
    </g>
    <ellipse cx="33" cy="66" rx="42" ry="7" fill="url(#floor)"/>
    <ellipse cx="33" cy="64.6" rx="18" ry="2.6" fill="url(#contact)"/>
    <ellipse cx="64.2" cy="61" rx="3.2" ry=".8" fill="url(#contact)"/>
  </g>

  <!-- ФИГУРА -->
  <g id="figure" filter="url(#contour)" stroke-linejoin="round">
    <!-- посох -->
    <g id="staff">
      <rect x="63.482" y="10.9297" width="1.40815" height="49.7483" rx=".7" fill="url(#wood)" stroke="url(#wood)" stroke-width="1.4"/>
      <path d="M63.7,14 C63.6,24 63.9,40 63.7,58" stroke="#fff3df" stroke-width=".35" opacity=".8" fill="none" stroke-linecap="round"/>
      <path d="M64.9,20 q.25,1.5 0,3 M64.8,44 q.25,1.2 0,2.4" stroke="#8a6848" stroke-width=".25" opacity=".6" fill="none" stroke-linecap="round"/>
      <rect x="62.9" y="10" width="2.6" height="1.6" rx=".6" fill="url(#brim)"/>
    </g>
    <!-- центральная колонна -->
    <path d="M30.6104 49.9002C30.9978 52.8008 35.1936 52.8006 35.5809 49.9002L38.7111 26.4581C38.9118 24.9548 37.7429 23.6188 36.2264 23.6188H29.965C28.4487 23.619 27.2795 24.955 27.4803 26.4581L30.6104 49.9002Z" fill="url(#robe)" stroke="url(#robe)" stroke-width="5"/>

    <!-- рукав левый + рукавица -->
    <g id="wingL">
      <use href="#pWingL" fill="url(#wingL)" stroke="url(#wingL)" stroke-width="5"/>
      <use href="#pWingL" fill="url(#trimV)" stroke="url(#trimV)" stroke-width="5" clip-path="url(#cCuffL)"/>
      
      <g clip-path="url(#cWingL)">
        <path d="M9,21 L25,27" stroke="#ffffff" stroke-width="1.4" opacity=".8" filter="url(#soft)"/>
        <path d="M26,24 L27.5,32" stroke="#6f88b3" stroke-width="3" opacity=".45" filter="url(#softer)"/>
        <path d="M13,24 C17,26.5 21,27.4 25,28 M13,33.5 C17,31.6 21,30.4 25,29.6" stroke="#9fb3d2" stroke-width=".45" opacity=".6" fill="none"/>
        <path d="M10,36.5 L25,30" stroke="#8aa2c6" stroke-width="1.6" opacity=".5" filter="url(#soft)"/>
        <path d="M8,39.5 L24,32.5" stroke="#d6efff" stroke-width="1.2" opacity=".7" filter="url(#soft)"/>
        <path d="M11,28.5 C16,28.8 20,28.6 24,28.4" stroke="#aebfd8" stroke-width=".35" opacity=".7" fill="none"/>
      </g>
    </g>
    <g id="wingR">
      <use href="#pWingR" fill="url(#wingR)" stroke="url(#wingR)" stroke-width="5"/>
      <use href="#pWingR" fill="url(#trimVR)" stroke="url(#trimVR)" stroke-width="5" clip-path="url(#cCuffR)"/>
      
      <g clip-path="url(#cWingL)" transform="translate(65 0) scale(-1 1)">
        <path d="M26,24 L27.5,32" stroke="#6f88b3" stroke-width="3" opacity=".5" filter="url(#softer)"/>
        <path d="M13,24 C17,26.5 21,27.4 25,28 M13,33.5 C17,31.6 21,30.4 25,29.6" stroke="#9fb3d2" stroke-width=".45" opacity=".6" fill="none"/>
        <path d="M10,36.5 L25,30" stroke="#8aa2c6" stroke-width="1.8" opacity=".55" filter="url(#soft)"/>
        <path d="M8,39.5 L24,32.5" stroke="#d6efff" stroke-width="1.4" opacity=".85" filter="url(#soft)"/>
        <path d="M9,21 L25,27" stroke="#ffffff" stroke-width="1" opacity=".55" filter="url(#soft)"/>
        <path d="M11,28.5 C16,28.8 20,28.6 24,28.4" stroke="#aebfd8" stroke-width=".35" opacity=".7" fill="none"/>
      </g>
    </g>

    <!-- мантия -->
    <g id="robe" filter="url(#drop)">
      <use href="#pRobe" fill="url(#robe)" stroke="url(#robe)" stroke-width="5"/>
      <use href="#pRobe" fill="url(#trim)" stroke="url(#trim)" stroke-width="5" clip-path="url(#cHem)"/>
      <g clip-path="url(#cRobe)">
        <path d="M26,34 C24,42 22,48 20.5,55" stroke="#ffffff" stroke-width="1.8" opacity=".75" filter="url(#soft)" fill="none"/>
        <path d="M33,36 C33,44 33.5,50 34,56" stroke="#9cb1cf" stroke-width="1.2" opacity=".45" filter="url(#soft)" fill="none"/>
        <path d="M38,34 C41,42 43.5,48 45,55" stroke="#8aa2c6" stroke-width="2" opacity=".45" filter="url(#soft)" fill="none"/>
        <path d="M47,50 C48,53 47,56 44,57.5" stroke="#d6efff" stroke-width="1.4" opacity=".8" filter="url(#soft)" fill="none"/>
        <ellipse cx="33" cy="37.5" rx="7" ry="2" fill="#7f98bf" opacity=".35" filter="url(#soft)"/>
      </g>
    </g>

    <!-- пелерина-воротник с застёжкой -->
    <g id="collar" filter="url(#drop)">
      <use href="#pCollar" fill="url(#collar)" stroke="url(#collar)" stroke-width="5"/>
      <path d="M22.3,22.2 H43.6" stroke="#ffffff" stroke-width=".7" opacity=".9" stroke-linecap="round"/>
      <path d="M27,26 L33,34.3" stroke="#ffffff" stroke-width=".9" opacity=".6" filter="url(#soft)"/>
      <path d="M40.5,26 L34.2,34.2" stroke="#9fb3d2" stroke-width="1" opacity=".5" filter="url(#soft)"/>
      <circle cx="33" cy="36.3" r="2.6" fill="url(#bloom)"/>
      <circle cx="33" cy="36.3" r="1.15" fill="url(#gem)"/>
      <circle cx="32.6" cy="35.9" r=".35" fill="#ffffff"/>
    </g>

    <!-- голова: волосы со спины -->
    <g id="head">
      <ellipse cx="28.9" cy="22.4" rx="1.9" ry="1.4" fill="url(#hair)"/><ellipse cx="37.3" cy="22.4" rx="1.9" ry="1.4" fill="url(#hair)"/>
      <circle cx="33.0959" cy="20.2587" r="4.81396" fill="url(#hair)"/>
      <ellipse cx="33.1" cy="16.4" rx="4.6" ry="1.3" fill="#7f98bf" opacity=".45" filter="url(#soft)"/>
      <path d="M30.2,17.6 C29.8,19.6 30.3,21.6 31.4,23.6 M33,16.6 C32.8,19 33,21.6 33.4,24.4 M35.8,17.4 C36.2,19.6 35.9,21.8 35,23.8" stroke="#d3ddea" stroke-width=".32" fill="none" stroke-linecap="round"/>
      <ellipse cx="31.4" cy="17.4" rx="1.4" ry=".8" fill="#ffffff" opacity=".85" transform="rotate(-25 31.4 17.4)"/>
    </g>

    <!-- шляпа -->
    <g id="hat">
      <use href="#pHat" fill="url(#hat)" stroke="url(#hat)" stroke-width="5"/>
      <path d="M31.2,13.9 L32.6,9.3" stroke="#ffffff" stroke-width=".7" opacity=".85" stroke-linecap="round"/>
      <path d="M34.4,11.4 L35.3,14.7" stroke="#8ea4c6" stroke-width=".8" opacity=".45" filter="url(#soft)"/>
      <rect x="30.8" y="14.8" width="4.4" height="1.2" rx=".5" fill="#8fb6e4"/>
      <rect x="25.171" y="16.1448" width="15.6494" height="1.40815" rx=".7" fill="url(#brim)" stroke="url(#brim)" stroke-width="1.4" filter="url(#drop)"/>
      <path d="M25.4,16 H40.6" stroke="#ffffff" stroke-width=".35" opacity=".95" stroke-linecap="round"/>
    </g>

    <!-- ботинки -->
    <use href="#pFootL" fill="url(#boot)"/>
    <use href="#pFootR" fill="url(#boot)"/>
    <ellipse cx="28.3" cy="61.4" rx="1.2" ry=".45" fill="#ffffff" opacity=".8"/>
    <ellipse cx="36.5" cy="61.4" rx="1.2" ry=".45" fill="#ffffff" opacity=".7"/>

    <!-- руки: рукавицы -->
    <rect y="24.0698" width="3.81105" height="9.42733" rx="1.9" fill="url(#glove)"/>
    <path d="M.3,31.4 H3.5" stroke="#8fb6e4" stroke-width=".7" stroke-linecap="round"/>
    <ellipse cx="1.2" cy="26.2" rx=".6" ry="1.4" fill="#ffffff" opacity=".8"/>
    <circle cx="63.9858" cy="29.4856" r="3.2" fill="url(#glove)"/>
    <path d="M61.3,28.4 Q62.4,26.6 64.2,27.1" stroke="#9fb4d3" stroke-width=".35" fill="none" stroke-linecap="round"/>
    <ellipse cx="62.2" cy="27.8" rx="1.1" ry=".8" fill="url(#glove)"/>
    <ellipse cx="63.1" cy="28.8" rx=".7" ry=".45" fill="#ffffff" opacity=".85"/>
    <path d="M61.2,31.6 Q64,33.3 66.8,31.6" stroke="#8fb6e4" stroke-width=".7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- зерно ткани поверх фигуры -->
  <mask id="mFig"><g fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round"><use href="#pRobe"/><use href="#pWingL"/><use href="#pWingR"/><use href="#pCollar"/><use href="#pHat"/></g></mask>
  <rect x="-18" y="-14" width="105" height="94" filter="url(#grain)" fill="#fff" mask="url(#mFig)" style="mix-blend-mode:multiply"/>

  <!-- ЗВЕЗДА: свечение поверх контура -->
  <g id="star">
    <circle cx="64.09" cy="4.93" r="9" fill="url(#bloom)"/>
    <use href="#pStar" fill="#bfe6ff" transform="translate(64.09 4.93) scale(1.35) translate(-64.09 -4.93)" filter="url(#softer)" opacity=".9"/>
    <use href="#pStar" fill="url(#starCore)"/>
    <circle cx="64.09" cy="4.93" r=".9" fill="#ffffff"/>
    <g fill="#ffffff">
      <circle cx="58.6" cy="1.2" r=".35" opacity=".9"/><circle cx="69.4" cy="9.6" r=".3" opacity=".8"/><circle cx="67.6" cy="-.6" r=".25" opacity=".7"/>
    </g>
  </g>
</svg>
