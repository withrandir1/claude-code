<title>Withrandir Peak Vibe</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: одна сцена на весь экран. Восемь состояний по кругу, пик сливается в центре в жидкую ауру. */
:root {
  color-scheme: dark;
  --bg: #06060b;
  --bg-2: #0d0c16;
  --fg: #f1effa;
  --dim: #8d8aa6;
  --line: rgba(241, 239, 250, .10);
  --glass: rgba(22, 20, 36, .55);
  --gold: #d4af37;
  --display: "Unbounded", "SF Pro Display", system-ui, sans-serif;
  --body: "Onest", "SF Pro Text", system-ui, sans-serif;
  /* пружины Apple-подобные: мягкий отклик с лёгким перелётом */
  --spring: cubic-bezier(.34, 1.36, .64, 1);
  --out: cubic-bezier(.16, 1, .3, 1);
  --slow: 1;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.45 var(--body); overflow: hidden;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }

/* Кромочное свечение экрана во время пика (как системный glow Apple Intelligence) */
@property --a { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
.edge {
  position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 2;
  transition: opacity calc(.9s * var(--slow)) var(--out);
  filter: blur(var(--blur)) saturate(1.2);
}
.edge > span {
  position: absolute; inset: 0; padding: var(--pad);
  background: conic-gradient(from var(--a), var(--c1), var(--c2), var(--c3), var(--c1));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: spin calc(6s * var(--slow)) linear infinite;
}
.edge { --pad: 3px; --blur: 3px; }
.edge.soft { --pad: 26px; --blur: 34px; }
.edge.on { opacity: 1; }
.edge.soft.on { opacity: .5; }
@keyframes spin { to { --a: 360deg; } }

/* Верхняя строка */
.top {
  position: fixed; left: 0; right: 0; top: 0; z-index: 3; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 0;
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
}
.brand { font: 500 12px/1 var(--display); letter-spacing: .28em; text-transform: uppercase; color: var(--dim); }
.live { font: 500 12px/1 var(--body); color: var(--dim); display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: #3ee08f; box-shadow: 0 0 10px #3ee08f; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

/* Карточка пика: материализация из размытия */
.peak {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); z-index: 3;
  width: min(360px, calc(100% - 32px));
  transform: translate(-50%, 24px) scale(.96); opacity: 0; filter: blur(14px);
  transition: transform calc(.9s * var(--slow)) var(--spring), opacity calc(.5s * var(--slow)) var(--out), filter calc(.6s * var(--slow)) var(--out);
  background: var(--glass); border: 1px solid var(--line); border-radius: 22px;
  -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4);
  padding: 16px 18px; pointer-events: none;
}
.peak.on { transform: translate(-50%, 0) scale(1); opacity: 1; filter: blur(0); }
.peak .eyebrow { font: 500 10.5px/1 var(--body); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
.peak .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 10px; }
.peak .name { font: 500 19px/1.2 var(--display); letter-spacing: -.01em; text-wrap: balance; min-width: 0; }
.peak .score { font: 300 44px/0.9 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.peak .score small { font-size: 14px; color: var(--dim); margin-left: 2px; }
.chips { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 7px; border-radius: 999px;
  background: rgba(255,255,255,.06); font: 500 12px/1 var(--body);
  opacity: 0; transform: translateY(8px); transition: opacity calc(.5s * var(--slow)) var(--out), transform calc(.7s * var(--slow)) var(--spring);
}
.peak.on .chip { opacity: 1; transform: none; }
.chip b { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }

/* Нижняя панель */
.dock {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 4;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  display: flex; gap: 6px; padding: 6px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
}
.dock button {
  font: 500 13px/1 var(--body); color: var(--fg); background: transparent; border: 0;
  padding: 11px 16px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  transition: background calc(.25s * var(--slow)) var(--out), transform calc(.4s * var(--slow)) var(--spring);
}
.dock button:hover { background: rgba(255,255,255,.07); }
.dock button:active { transform: scale(.94); }
.dock button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.dock button.primary { background: var(--fg); color: var(--bg); font-weight: 600; }
.dock button.primary:hover { background: #fff; }
.dock button[aria-pressed="true"] { background: rgba(212,175,55,.18); color: var(--gold); }
@media (max-width: 420px) { .dock button { padding: 11px 12px; font-size: 12px; } .peak { bottom: calc(env(safe-area-inset-bottom, 0px) + 88px); } }
</style>

<canvas id="stage" aria-label="Восемь состояний вайба; пик выделяется в центре"></canvas>
<div class="edge soft" id="edgeSoft"><span></span></div>
<div class="edge" id="edge"><span></span></div>

<div class="top">
  <span class="brand">Withrandir · вайб</span>
  <span class="live"><i></i><span id="people">24</span> в комнате</span>
</div>

<div class="peak" id="peak" role="status" aria-live="polite">
  <div class="eyebrow">Пик вайба · самая сильная конфигурация</div>
  <div class="row">
    <div class="name" id="peakName">—</div>
    <div class="score"><span id="peakScore">0</span><small>%</small></div>
  </div>
  <div class="chips" id="chips"></div>
</div>

<nav class="dock">
  <button class="primary" id="btnPeak">Показать пик</button>
  <button id="btnSlow" aria-pressed="false">Замедлить ×4</button>
  <button id="btnAuto" aria-pressed="true">Авто</button>
</nav>

<script>
'use strict';
// 8 состояний — та же палитра, что в aura-lab (PALETTE, цифры 0–7).
const STATES = [
  { name: 'белый',      hex: '#F5F5F7' },
  { name: 'синий',      hex: '#2F6BFF' },
  { name: 'зелёный',    hex: '#22C55E' },
  { name: 'жёлтый',     hex: '#FACC15' },
  { name: 'оранжевый',  hex: '#FF8A1F' },
  { name: 'красный',    hex: '#EF4444' },
  { name: 'розовый',    hex: '#FF4FA3' },
  { name: 'фиолетовый', hex: '#8B5CF6' },
];
const PHI = 1.6180339887;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgba = (h, a) => { const [r, g, b] = rgb(h); return `rgba(${r},${g},${b},${a})`; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOutExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const easeInCubic = t => t * t * t;

// ---------- Пружина (полунеявный Эйлер, подшаги 1/240 с) ----------
// stiffness/damping подобраны под «response 0.5 / dampingFraction 0.75» из SwiftUI.
class Spring {
  constructor(v, k = 160, c = 19) { this.x = v; this.target = v; this.vel = 0; this.k = k; this.c = c; }
  set(t) { this.target = t; return this; }
  snap(v) { this.x = this.target = v; this.vel = 0; }
  step(dt) {
    for (let t = 0; t < dt; t += 1 / 240) {
      const h = Math.min(1 / 240, dt - t);
      this.vel += (-this.k * (this.x - this.target) - this.c * this.vel) * h;
      this.x += this.vel * h;
    }
    return this.x;
  }
}

// ---------- Сцена ----------
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

// Сглаженный шум для «живой» энергии комнаты
const seeds = STATES.map(() => [Math.random() * 100, Math.random() * 100, .6 + Math.random() * .8]);
function noise(i, t) {
  const [a, b, f] = seeds[i];
  return .5 + .28 * Math.sin(t * .31 * f + a) + .17 * Math.sin(t * .83 * f + b) + .05 * Math.sin(t * 2.1 + a * b);
}

const orbs = STATES.map((s, i) => ({
  ...s, i, energy: .4,
  px: new Spring(0, 120, 17), py: new Spring(0, 120, 17),
  scale: new Spring(1, 180, 16), alpha: new Spring(1, 90, 19),
}));
const blob = { scale: new Spring(0, 140, 13), alpha: new Spring(0, 70, 17), spin: 0 };
const dim = new Spring(0, 80, 18);           // затемнение фона вокруг пика
const cam = new Spring(1, 90, 14);           // лёгкий «вдох» камеры
let rings = [], sparks = [];
let peak = null;                             // { t0, members, score }
let surge = null;                            // искусственный всплеск для демо

function homePos(i) {
  const R = Math.min(W, H) * (W < 520 ? .34 : .3);
  const a = -Math.PI / 2 + i * Math.PI / 4;
  return [W / 2 + R * Math.cos(a), H * .46 + R * Math.sin(a)];
}
orbs.forEach(o => { const [x, y] = homePos(o.i); o.px.snap(x); o.py.snap(y); });

// Самая интенсивная конфигурация: тройка состояний с максимальной суммарной энергией,
// взвешенной на связность (соседи по кругу усиливают друг друга — общий вайб).
function findPeak() {
  const e = orbs.map(o => o.energy);
  const ids = [...e.keys()].sort((a, b) => e[b] - e[a]).slice(0, 3);
  const adj = (a, b) => { const d = Math.abs(a - b) % 8; return d === 1 || d === 7; };
  let bond = 0;
  for (let a = 0; a < 3; a++) for (let b = a + 1; b < 3; b++) if (adj(ids[a], ids[b])) bond += .06;
  const score = Math.round(clamp(ids.reduce((s, i) => s + e[i], 0) / 3 + bond, 0, 1) * 100);
  return { members: ids, score };
}

// ---------- Хореография пика ----------
// 0.00 предвосхищение: остальные гаснут и чуть сжимаются
// 0.12 участники стягиваются к центру на пружине
// 0.45 слияние в жидкую ауру (пружина с перелётом), ударная волна ×2 с шагом φ
// 0.70 карточка материализуется из размытия, счётчик докручивается
// ~5 с удержание, затем возврат пружинами
const $ = id => document.getElementById(id);
const later = [];
function at(ms, fn) { later.push({ at: clock + ms / 1000, fn }); }

function showPeak() {
  if (peak) { hidePeak(); return; }
  later.length = 0;
  const p = findPeak();
  peak = { ...p, t0: clock };
  const m = new Set(p.members);
  const cols = p.members.map(i => STATES[i].hex);

  // фаза 1: фокус
  orbs.forEach(o => { if (!m.has(o.i)) { o.alpha.set(.18); o.scale.set(.82); } });
  dim.set(1);
  cam.set(.97);
  navigator.vibrate?.(8);

  // фаза 2: стягивание
  at(REDUCED ? 0 : 120, () => {
    p.members.forEach((i, k) => {
      const a = -Math.PI / 2 + k * Math.PI * 2 / 3;
      const r = Math.min(W, H) * .06;
      orbs[i].px.set(W / 2 + r * Math.cos(a));
      orbs[i].py.set(H * .46 + r * Math.sin(a));
      orbs[i].scale.set(1.15);
      spawnSparks(orbs[i]);
    });
  });
  // фаза 3: слияние + волна
  at(REDUCED ? 0 : 450, () => {
    blob.scale.set(1); blob.alpha.set(1); cam.set(1.02);
    p.members.forEach(i => orbs[i].alpha.set(0));
    rings.push({ t0: clock, cols }, { t0: clock + .18 * PHI, cols });
    for (const el of [$('edge'), $('edgeSoft')]) {
      const sp = el.firstElementChild; sp.style.setProperty('--c1', cols[0]); sp.style.setProperty('--c2', cols[1]); sp.style.setProperty('--c3', cols[2]);
      el.classList.add('on');
    }
    navigator.vibrate?.([14, 40, 10]);
  });
  // фаза 4: карточка
  at(REDUCED ? 0 : 700, () => {
    $('peakName').innerHTML = p.members.map(i => `<span style="white-space:nowrap">${STATES[i].name}</span>`).join(' · ');
    $('chips').innerHTML = p.members.map((i, k) =>
      `<span class="chip" style="transition-delay:calc(${120 + k * 70}ms * var(--slow))"><b style="background:${STATES[i].hex};color:${STATES[i].hex}"></b>${STATES[i].name} ${Math.round(orbs[i].energy * 100)}</span>`).join('');
    $('peak').classList.add('on');
    countUp(p.score);
    cam.set(1);
  });
  // фаза 5: возврат
  if (auto) at(5200, hidePeak);
}

function hidePeak() {
  if (!peak) return;
  later.length = 0;
  orbs.forEach(o => { const [x, y] = homePos(o.i); o.px.set(x); o.py.set(y); o.scale.set(1); o.alpha.set(1); });
  blob.scale.set(0); blob.alpha.set(0);
  dim.set(0); cam.set(1);
  $('peak').classList.remove('on');
  $('edge').classList.remove('on'); $('edgeSoft').classList.remove('on');
  peak = null;
}

function countUp(target) {
  const el = $('peakScore'), t0 = performance.now(), dur = REDUCED ? 0 : 900 * timeScale;
  const tick = now => {
    const p = dur ? clamp((now - t0) / dur) : 1;
    el.textContent = Math.round(easeOutExpo(p) * target);
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function spawnSparks(o) {
  if (REDUCED) return;
  for (let k = 0; k < 14; k++) {
    const a = Math.random() * Math.PI * 2, r = 30 + Math.random() * 70;
    sparks.push({ x0: o.px.x + r * Math.cos(a), y0: o.py.x + r * Math.sin(a), t0: clock + Math.random() * .2, dur: .5 + Math.random() * .35, hex: o.hex, s: 1 + Math.random() * 1.6 });
  }
}

// ---------- Отрисовка ----------
function drawBackground(t) {
  const g = ctx.createRadialGradient(W / 2, H * .46, 0, W / 2, H * .46, Math.max(W, H) * .75);
  g.addColorStop(0, '#0d0c16'); g.addColorStop(1, '#06060b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // едва заметные кольца φ — «слои» комнаты
  const R0 = Math.min(W, H) * .07;
  ctx.lineWidth = 1;
  for (let k = 0; k < 5; k++) {
    ctx.strokeStyle = `rgba(212,175,55,${(.07 - k * .01) * (1 - dim.x * .6)})`;
    ctx.beginPath(); ctx.arc(W / 2, H * .46, R0 * Math.pow(PHI, k), 0, Math.PI * 2); ctx.stroke();
  }
}

function drawOrb(o) {
  const a = clamp(o.alpha.x);
  if (a < .01) return;
  const r = (14 + 26 * o.energy) * o.scale.x;
  const x = o.px.x, y = o.py.x;
  ctx.globalCompositeOperation = 'lighter';
  const halo = ctx.createRadialGradient(x, y, 0, x, y, r * 3.2);
  halo.addColorStop(0, rgba(o.hex, .38 * a * (.5 + o.energy)));
  halo.addColorStop(1, rgba(o.hex, 0));
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(x, y, r * 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  // стеклянное ядро: цвет + блик сверху слева
  const core = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r);
  core.addColorStop(0, rgba('#ffffff', .85 * a));
  core.addColorStop(.35, rgba(o.hex, a));
  core.addColorStop(1, rgba(o.hex, .55 * a));
  ctx.fillStyle = core; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  // подпись
  if (a > .3) {
    ctx.fillStyle = `rgba(241,239,250,${.55 * a})`;
    ctx.font = '500 11px Onest, system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(o.name, x, y + r + 20);
    ctx.fillStyle = `rgba(141,138,166,${.8 * a})`;
    ctx.font = '400 10px Onest, system-ui, sans-serif';
    ctx.fillText(Math.round(o.energy * 100), x, y + r + 34);
  }
}

// Жидкая аура: замкнутый контур с гармониками по радиусу, залитый вращающимся коническим градиентом цветов пика
function drawBlob(t) {
  const s = blob.scale.x, a = clamp(blob.alpha.x);
  if (s < .01 || !peak) return;
  const cols = peak.members.map(i => STATES[i].hex);
  const cx = W / 2, cy = H * .46;
  const R = Math.min(W, H) * .15 * s * (1 + .03 * Math.sin(t * 2.2)) * (0.8 + peak.score / 500);
  const path = new Path2D();
  const N = 120;
  for (let k = 0; k <= N; k++) {
    const th = k / N * Math.PI * 2;
    const r = R * (1 + .06 * Math.sin(3 * th + t * 1.3) + .04 * Math.sin(5 * th - t * 1.7) + .025 * Math.sin(2 * th + t * .9));
    const x = cx + r * Math.cos(th), y = cy + r * Math.sin(th);
    k ? path.lineTo(x, y) : path.moveTo(x, y);
  }
  path.closePath();
  blob.spin += 0.012;
  let fill;
  if (ctx.createConicGradient) {
    fill = ctx.createConicGradient(blob.spin, cx, cy);
    cols.forEach((c, k) => fill.addColorStop(k / 3, c)); fill.addColorStop(1, cols[0]);
  } else {
    fill = ctx.createRadialGradient(cx, cy, 0, cx, cy, R); fill.addColorStop(0, cols[1]); fill.addColorStop(1, cols[0]);
  }
  ctx.save();
  ctx.globalAlpha = a;
  // внешнее свечение
  ctx.shadowColor = rgba(cols[0], .9); ctx.shadowBlur = 80;
  ctx.fillStyle = fill; ctx.fill(path);
  ctx.shadowBlur = 0;
  // объём: светлая сердцевина и тёмный край
  ctx.clip(path);
  const vol = ctx.createRadialGradient(cx - R * .3, cy - R * .35, R * .05, cx, cy, R * 1.05);
  vol.addColorStop(0, 'rgba(255,255,255,.75)');
  vol.addColorStop(.35, 'rgba(255,255,255,.08)');
  vol.addColorStop(1, 'rgba(6,6,11,.45)');
  ctx.fillStyle = vol; ctx.fillRect(cx - R * 1.3, cy - R * 1.3, R * 2.6, R * 2.6);
  ctx.restore();
}

function drawRings() {
  const cx = W / 2, cy = H * .46, maxR = Math.hypot(W, H) * .55;
  rings = rings.filter(r => clock - r.t0 < 1.6);
  for (const r of rings) {
    const p = clamp((clock - r.t0) / 1.6);
    if (p <= 0) continue;
    const rad = Math.min(W, H) * .12 + easeOutExpo(p) * maxR;
    ctx.lineWidth = 2.5 * (1 - p) + .5;
    const g = ctx.createLinearGradient(cx - rad, cy, cx + rad, cy);
    r.cols.forEach((c, k) => g.addColorStop(k / 2, rgba(c, Math.pow(1 - p, 2) * .9)));
    ctx.strokeStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.stroke();
  }
}

function drawSparks() {
  const cx = W / 2, cy = H * .46;
  sparks = sparks.filter(s => clock - s.t0 < s.dur);
  ctx.globalCompositeOperation = 'lighter';
  for (const s of sparks) {
    const p = clamp((clock - s.t0) / s.dur);
    if (p <= 0) continue;
    const e = easeInCubic(p);
    const x = s.x0 + (cx - s.x0) * e, y = s.y0 + (cy - s.y0) * e;
    ctx.fillStyle = rgba(s.hex, (1 - p) * .9);
    ctx.beginPath(); ctx.arc(x, y, s.s * (1 - p * .5), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

// ---------- Цикл ----------
let clock = 0, last = performance.now(), timeScale = 1, auto = true, nextAuto = 3;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000) / timeScale;
  last = now; clock += dt;

  // энергия комнаты; во время пика замирает, чтобы конфигурация не «уплывала»
  if (!peak) orbs.forEach(o => {
    let e = noise(o.i, clock);
    if (surge && surge.ids.includes(o.i)) e += .45 * Math.sin(Math.PI * clamp((clock - surge.t0) / 2.4));
    o.energy += (clamp(e, .05, 1) - o.energy) * (1 - Math.exp(-3 * dt));
  });
  if (auto && !peak && clock > nextAuto) {
    // всплеск у трёх соседних состояний, затем пик
    const s = Math.random() * 8 | 0;
    surge = { t0: clock, ids: [s, (s + 1) % 8, (s + 2 + (Math.random() * 2 | 0)) % 8] };
    nextAuto = clock + 9;
    setTimeout(() => { if (!peak) showPeak(); }, 1400 * timeScale);
  }
  while (later.length && later[0].at <= clock) later.shift().fn();
  later.sort((a, b) => a.at - b.at);

  for (const o of orbs) { o.px.step(dt); o.py.step(dt); o.scale.step(dt); o.alpha.step(dt); }
  blob.scale.step(dt); blob.alpha.step(dt); dim.step(dt); cam.step(dt);

  drawBackground(clock);
  ctx.save();
  ctx.translate(W / 2, H * .46); ctx.scale(cam.x, cam.x); ctx.translate(-W / 2, -H * .46);
  drawRings();
  orbs.forEach(drawOrb);
  drawSparks();
  drawBlob(clock);
  ctx.restore();
  // виньетка фокуса
  if (dim.x > .01) {
    const v = ctx.createRadialGradient(W / 2, H * .46, Math.min(W, H) * .2, W / 2, H * .46, Math.max(W, H) * .7);
    v.addColorStop(0, 'rgba(6,6,11,0)'); v.addColorStop(1, `rgba(6,6,11,${.7 * clamp(dim.x)})`);
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }
  document.getElementById('people').textContent = 24 + Math.round(3 * Math.sin(clock * .07));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- Управление ----------
$('btnPeak').onclick = () => { showPeak(); $('btnPeak').textContent = peak ? 'Скрыть' : 'Показать пик'; };
cv.onclick = () => $('btnPeak').click();
$('btnSlow').onclick = e => {
  timeScale = timeScale === 1 ? 4 : 1;
  e.currentTarget.setAttribute('aria-pressed', timeScale > 1);
  document.documentElement.style.setProperty('--slow', timeScale);
};
$('btnAuto').onclick = e => { auto = !auto; e.currentTarget.setAttribute('aria-pressed', auto); if (auto) nextAuto = clock + 1; };
setInterval(() => { $('btnPeak').textContent = peak ? 'Скрыть' : 'Показать пик'; }, 250);
</script>
